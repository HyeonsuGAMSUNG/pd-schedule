<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle">PD 스케쥴</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css?v=20261015b">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="backlink" href="index.html">‹ PD 목록</a>
    <div class="brand">
      <h1 id="pdName">스케쥴</h1>
      <span class="tag-rec">REC</span>
    </div>
    <div class="sub" id="syncNote">데이터 불러오는 중…</div>
    <button type="button" class="adm-btn" id="admBtn">관리자</button>
  </div>
</header>

<div class="wrap">
  <div id="calArea"><div class="empty">일정 불러오는 중…</div></div>

  <div class="section-title"><h2>전체 일정</h2></div>
  <div class="month-nav" id="monthNav"></div>
  <div id="scheduleArea"></div>

  <footer>
    이 페이지는 정적 파일(data/*.json)만 읽어요. 일정이 바뀌면 그 json 파일을 새로 받아 덮어써야 반영돼요.
  </footer>
</div>

<script src="sync-status.js"></script>
<script src="admin.js?v=2"></script>
<script>
(function(){
  var CATS = {
    china:{label:'중국', hue:18},
    japan:{label:'일본', hue:350},
    korea:{label:'한국', hue:205},
    global1:{label:'글로벌 1기', hue:262},
    globalcareer:{label:'글로벌 커리어', hue:285},
    album:{label:'AI 아티스트', hue:40},
    jordan:{label:'조던쇼를 잡아라', hue:165},
    hitmakers:{label:'히트메이커스 멜법', hue:130},
    nova:{label:'노바 피드백', hue:0},
    openclass:{label:'오픈 특강', hue:95},
    holiday:{label:'공휴일/휴무', hue:210},
    beginner:{label:'초급반', hue:230},
    trackdesign:{label:'트랙디자인', hue:310},
    sunocomp:{label:'수노 작곡반', hue:70},
    demo:{label:'DEMO 메이킹 클래스 3기', hue:190},
    genre:{label:'장르특강', hue:150},
    tsm:{label:'일본 유학 TSM', hue:10},
    toplinefree:{label:'탑라인 무료특강', hue:330},
    ginger:{label:'진저브레드 글로벌1기', hue:55},
    bensamama:{label:'벤사마마 글로벌1기', hue:340},
    freelecture:{label:'무료특강', hue:180},
    sunolyric:{label:'수노 작사 법칙', hue:100},
    aiartist:{label:'AI 아티스트', hue:25}
  };
  var CAT_BASE = {china:'중국', japan:'일본', korea:'한국', global1:'글로벌', globalcareer:'커리어', album:'AI아티스트', jordan:'조던', hitmakers:'히트2', nova:'노바', openclass:'오픈', holiday:'휴일', beginner:'초급', trackdesign:'트랙디자인', sunocomp:'수노작곡', demo:'데메클3기', genre:'장르특강', tsm:'TSM', toplinefree:'탑라인무료', ginger:'진저브레드', bensamama:'벤사마마', freelecture:'무료특강', sunolyric:'수노작사', aiartist:'AI아티스트'};
  var CAT_NO_SUFFIX = {global1:true};
  function shortLabel(e){
    var base = CAT_BASE[e.category] || e.category;
    if(CAT_NO_SUFFIX[e.category]) return base;
    var m = /(\d+)\s*기/.exec(e.title);
    return m ? base+m[1]+'기' : base;
  }
  var DOW = ['일','월','화','수','목','금','토'];

  var events = [];
  var byDate = {};
  var minYm = null, maxYm = null;
  var curYm = null;
  var selectedDate = null;
  var admin = {};
  Object.defineProperty(admin, 'on', {get:function(){ return !!(window.PDAdmin && PDAdmin.isOn()); }});
  var moving = null;

  function pad(n){return String(n).length<2?'0'+n:String(n)}
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function dowOf(dateStr){
    var p = dateStr.split('-').map(Number);
    return new Date(p[0], p[1]-1, p[2]).getDay();
  }
  function fmtKDate(dateStr){
    var p = dateStr.split('-').map(Number);
    return p[1]+'월 '+p[2]+'일';
  }
  function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
  function shiftYm(ym, delta){
    var y = parseInt(ym.slice(0,4),10), m = parseInt(ym.slice(5,7),10);
    m += delta;
    while(m>12){m-=12;y++;}
    while(m<1){m+=12;y--;}
    return y+'-'+pad(m);
  }
  function getParam(name){
    var m = new RegExp('[?&]'+name+'=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function tagHtml(category){
    var cat = CATS[category] || {label:category, hue:0};
    return '<span class="tagc" style="--h:'+cat.hue+'">'+cat.label+'</span>';
  }

  function dayDetailHtml(dateStr){
    var dow = DOW[dowOf(dateStr)];
    var dayEvents = byDate[dateStr] || [];
    var blocking = dayEvents.filter(function(e){return e.blocks});
    var pillCls = blocking.length ? 'busy' : 'free';
    var pillText = blocking.length ? '일정 있음' : '비어있음';

    var listHtml = dayEvents.map(function(e){
      var timeLabel = e.time ? e.time : '녹화';
      return '<li class="ev'+(e.blocks?'':' is-off')+(admin.on?' adm':'')+'" data-i="'+events.indexOf(e)+'"'+(admin.on?' draggable="true"':'')+'>'
        + '<span class="time mono">'+timeLabel+'</span>'
        + '<span class="title">'+e.title+'</span>'
        + tagHtml(e.category)
        + admRow()
        + '</li>';
    }).join('');

    return '<div class="dd-head"><span class="pill '+pillCls+'">'+pillText+'</span>'
      + '<span class="dd-date mono">'+fmtKDate(dateStr)+' ('+dow+')</span></div>'
      + (dayEvents.length ? '<ul class="dd-list">'+listHtml+'</ul>' : '<div class="dd-empty">등록된 일정이 없어요.</div>')
      + (admin.on ? '<button type="button" class="adm-add" data-date="'+dateStr+'">+ 이 날짜에 일정 추가</button>' : '');
  }

  function selectDay(dateStr){
    selectedDate = dateStr;
    renderCalendar(curYm);
  }

  function renderCalendar(ym){
    curYm = ym;
    var y = parseInt(ym.slice(0,4),10), m = parseInt(ym.slice(5,7),10);
    var total = daysInMonth(y,m);
    var firstDow = dowOf(ym+'-01');
    var today = todayStr();

    var cells = [];
    for(var i=0;i<firstDow;i++) cells.push('<div class="cal-cell pad"></div>');
    for(var d=1; d<=total; d++){
      var ds = ym+'-'+pad(d);
      var dayEvents = byDate[ds] || [];
      var blocking = dayEvents.filter(function(e){return e.blocks});
      var cls = 'cal-cell ' + (blocking.length ? 'busy' : 'free');
      if(ds===today) cls += ' today';
      if(ds===selectedDate) cls += ' selected';
      var labelHtml = '';
      var labelSource = blocking.length ? blocking : dayEvents;
      if(labelSource.length){
        var h = (CATS[labelSource[0].category]||{}).hue;
        var short = shortLabel(labelSource[0]);
        var more = labelSource.length>1 ? '+'+(labelSource.length-1) : '';
        var mutedCls = blocking.length ? '' : ' muted';
        labelHtml = '<span class="lbl'+mutedCls+'" style="--h:'+(h!==undefined?h:0)+'">'+short+more+'</span>';
      }
      if(admin.on){ labelHtml = '<span class="apills">'+dayEvents.map(pillHtml).join('')+'</span>'; }
      var dowMini = '<span class="dow-mini">'+DOW[dowOf(ds)]+'</span>';
      cells.push('<div class="'+cls+'" data-date="'+ds+'">'+dowMini+'<span class="num">'+d+'</span>'+labelHtml+'</div>');
    }
    var trailing = (7 - (cells.length % 7)) % 7;
    for(var t=0;t<trailing;t++) cells.push('<div class="cal-cell pad"></div>');

    var area = document.getElementById('calArea');
    area.innerHTML =
      '<div class="cal-nav">'
      + '<button id="prevBtn" '+(ym<=minYm?'disabled':'')+'>‹</button>'
      + '<span class="label">'+y+'년 '+m+'월</span>'
      + '<button id="nextBtn" '+(ym>=maxYm?'disabled':'')+'>›</button>'
      + '</div>'
      + '<div class="legend"><span><span class="sw free"></span>비어있음</span><span><span class="sw busy"></span>일정 있음</span></div>'
      + (admin.on && moving ? '<div class="movebanner"><span>옮길 날짜를 눌러 주세요</span><button type="button" id="moveCancel">취소</button></div>' : '')
      + '<div class="cal-dow">'+DOW.map(function(w){return '<span>'+w+'</span>'}).join('')+'</div>'
      + '<div class="cal-grid" id="calGrid">'+cells.join('')+'</div>'
      + '<div class="day-detail" id="dayDetail"></div>';

    document.getElementById('prevBtn').addEventListener('click', function(){ if(ym>minYm) renderCalendar(shiftYm(ym,-1)); });
    document.getElementById('nextBtn').addEventListener('click', function(){ if(ym<maxYm) renderCalendar(shiftYm(ym,1)); });
    document.getElementById('calGrid').addEventListener('click', function(ev){
      var cell = ev.target.closest('.cal-cell');
      if(!cell || cell.classList.contains('pad')) return;
      if(admin.on && moving){ doMove(cell.getAttribute('data-date')); return; }
      selectDay(cell.getAttribute('data-date'));
    });
    var mc = document.getElementById('moveCancel');
    if(mc) mc.addEventListener('click', function(){ moving = null; renderCalendar(curYm); });

    var dd = document.getElementById('dayDetail');
    dd.innerHTML = (selectedDate && selectedDate.slice(0,7)===ym)
      ? dayDetailHtml(selectedDate)
      : '<div class="dd-empty">날짜를 눌러서 그날 일정을 확인해요.</div>';
  }

  function renderSchedule(){
    var area = document.getElementById('scheduleArea');
    var nav = document.getElementById('monthNav');
    var months = {};
    events.forEach(function(e){
      var mk = e.date.slice(0,7);
      months[mk] = months[mk] || {};
      months[mk][e.date] = months[mk][e.date] || [];
      months[mk][e.date].push(e);
    });
    var monthKeys = Object.keys(months).sort();
    var today = todayStr();

    nav.innerHTML = monthKeys.map(function(mk){
      return '<a href="#m-'+mk+'">'+parseInt(mk.slice(5,7),10)+'월</a>';
    }).join('');

    area.innerHTML = monthKeys.map(function(mk){
      var mNum = parseInt(mk.slice(5,7),10), yr = mk.slice(0,4);
      var dateKeys = Object.keys(months[mk]).sort();
      var daysHtml = dateKeys.map(function(dk){
        var evs = months[mk][dk].slice().sort(function(a,b){ return (a.time||'99:99').localeCompare(b.time||'99:99'); });
        var dow = DOW[dowOf(dk)];
        var dnum = parseInt(dk.slice(8,10),10), mnum = parseInt(dk.slice(5,7),10);
        var isToday = dk === today;
        var evHtml = evs.map(function(e){
          var timeLabel = e.time ? e.time : '녹화';
          return '<div class="ev'+(e.blocks?'':' is-off')+(admin.on?' adm':'')+'" data-i="'+events.indexOf(e)+'"'+(admin.on?' draggable="true"':'')+'>'
            + '<span class="time mono">'+timeLabel+'</span>'
            + '<span class="title">'+e.title+'</span>'
            + tagHtml(e.category)
            + admRow()
            + '</div>';
        }).join('');
        return '<div class="day"><div class="day-head"><span class="date-num">'+mnum+'/'+dnum+'</span>'
          + '<span class="dow">('+dow+')</span>'+(isToday?'<span class="today-mark">오늘</span>':'')+'</div>'+evHtml+'</div>';
      }).join('');
      return '<div class="month" id="m-'+mk+'"><h3>'+yr+'년 '+mNum+'월</h3>'+daysHtml+'</div>';
    }).join('');
  }

  var pdId = getParam('pd');
  function load(){
    if(admin.on) return Promise.resolve();
    return Promise.all([
      fetch(PDSync.bust('data/pds.json'), {cache:'no-store'}).then(function(r){ return r.json(); }).catch(function(){ return []; }),
      fetch(PDSync.bust('data/'+pdId+'.json'), {cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('not found');
        return r.json();
      })
    ]).then(function(res){
      var pds = res[0], data = res[1];
      var pd = pds.filter(function(p){ return p.id===pdId; })[0];
      var name = pd ? pd.name : pdId;
      document.getElementById('pdName').textContent = name;
      document.getElementById('pageTitle').textContent = name + ' 스케쥴';

      events = data.slice().sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
      byDate = {};
      events.forEach(function(e){
        byDate[e.date] = byDate[e.date] || [];
        byDate[e.date].push(e);
      });
      document.getElementById('syncNote').textContent = '등록된 일정 '+events.length+'건 · 정적 파일 기준';

      if(!events.length){
        document.getElementById('calArea').innerHTML = '<div class="empty">아직 등록된 일정이 없어요.</div>';
        return;
      }
      minYm = events[0].date.slice(0,7);
      maxYm = events[events.length-1].date.slice(0,7);
      var todayYm = todayStr().slice(0,7);
      var keepYm = (curYm && curYm>=minYm && curYm<=maxYm) ? curYm : ((todayYm>=minYm && todayYm<=maxYm) ? todayYm : minYm);
      renderCalendar(keepYm);
      renderSchedule();
    }).catch(function(){
      document.getElementById('syncNote').textContent = '일정을 불러오지 못했어요.';
      document.getElementById('calArea').innerHTML = '<div class="empty">해당 PD의 일정 파일을 찾을 수 없어요.</div>';
    });
  }

  // =====================================================================
  // 관리자 편집 (공용 admin.js 사용) — 이 PD의 data/<pd>.json 만 고쳐요.
  // =====================================================================
  function pillHtml(e){
    var c = CATS[e.category] || {hue:0};
    return '<span class="apill'+(e.blocks?'':' off')+'" style="--h:'+c.hue+'" draggable="true" data-i="'+events.indexOf(e)+'" title="'+PDAdmin.esc(e.title)+'">'+(e.time?e.time+' ':'')+PDAdmin.esc(e.title.replace(/^\[[^\]]*\]\s*/,''))+'</span>';
  }
  function openPillMenu(e){
    var m = PDAdmin.openModal('<h3>'+PDAdmin.esc(e.title)+'</h3>'
      + '<div class="pmenu-sub">'+dlabel(e.date)+(e.time?' '+e.time:'')+'</div>'
      + '<div class="btns"><button type="button" id="pEdit">수정</button><button type="button" id="pMove">날짜 이동</button><button type="button" id="pDel">삭제</button></div>'
      + '<div class="hint">PC에서는 달력 칸 안의 일정을 끌어서 다른 날짜에 놓아도 돼요.</div>');
    m.querySelector('#pEdit').addEventListener('click', function(){ PDAdmin.closeModal(); editEvent(e); });
    m.querySelector('#pMove').addEventListener('click', function(){ PDAdmin.closeModal(); moving = e; renderCalendar(curYm); });
    m.querySelector('#pDel').addEventListener('click', function(){
      PDAdmin.closeModal();
      if(confirm('"'+e.title+'" ('+dlabel(e.date)+') 일정을 삭제할까요?')){
        events.splice(events.indexOf(e),1); PDAdmin.log('삭제: '+e.title+' '+dlabel(e.date), [pdId]); adminRerender();
      }
    });
  }
  function editEvent(e){
    PDAdmin.openEdit({title:e.title, date:e.date, time:e.time, category:e.category, blocks:e.blocks}, function(f){
      var od = e.date;
      e.title = f.title; e.date = f.date; e.time = f.time; e.category = f.category; e.blocks = f.blocks;
      PDAdmin.log('수정: '+f.title+(od!==f.date?' ('+dlabel(od)+' → '+dlabel(f.date)+')':''), [pdId]);
      selectedDate = f.date; curYm = f.date.slice(0,7); adminRerender();
    });
  }
  function admRow(){
    return admin.on ? '<div class="adm-row"><button type="button" data-act="edit">수정</button><button type="button" data-act="move">날짜 이동</button><button type="button" data-act="del" class="danger">삭제</button></div>' : '';
  }
  function dlabel(ds){ var q=ds.split('-').map(Number); return q[1]+'/'+q[2]+'('+DOW[dowOf(ds)]+')'; }
  function sortEvents(){ events.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); }); }
  function rebuildByDate(){
    byDate = {};
    events.forEach(function(e){ (byDate[e.date] = byDate[e.date] || []).push(e); });
  }
  function adminRerender(){
    sortEvents(); rebuildByDate();
    var ym = (selectedDate || todayStr()).slice(0,7);
    minYm = events.length ? events[0].date.slice(0,7) : ym;
    maxYm = events.length ? events[events.length-1].date.slice(0,7) : ym;
    if(selectedDate){ if(ym<minYm) minYm = ym; if(ym>maxYm) maxYm = ym; }
    if(!curYm || curYm<minYm || curYm>maxYm) curYm = ym<minYm ? minYm : (ym>maxYm ? maxYm : ym);
    renderCalendar(curYm); renderSchedule(); PDAdmin.updateBar();
  }
  function doMove(newDate){
    var e = moving; moving = null;
    if(!e || e.date===newDate){ renderCalendar(curYm); return; }
    var old = e.date; e.date = newDate;
    PDAdmin.log('이동: '+e.title+' '+dlabel(old)+' → '+dlabel(newDate), [pdId]);
    selectedDate = newDate; curYm = newDate.slice(0,7);
    adminRerender();
  }

  PDAdmin.init({
    btn: document.getElementById('admBtn'),
    cats: CATS,
    getPds: function(){ return []; },
    onEnter: function(){
      return PDAdmin.fetchFile('data/'+pdId+'.json', pdId).then(function(arr){ events = arr; moving = null; sortEvents(); rebuildByDate(); });
    },
    onExit: function(){ moving = null; load(); },
    rerender: adminRerender,
    getFiles: function(){ return [{key:pdId, path:'data/'+pdId+'.json', text:PDAdmin.serialize(events)}]; }
  });

  document.addEventListener('click', function(ev){
    if(!admin.on) return;
    var pill = ev.target.closest('.apill');
    if(pill && !moving){ ev.stopPropagation(); var pe = events[parseInt(pill.getAttribute('data-i'),10)]; if(pe) openPillMenu(pe); return; }
    var add = ev.target.closest('.adm-add');
    if(add){
      PDAdmin.openAdd({mode:'single', date:add.getAttribute('data-date'), category:'beginner'}, function(f){
        events.push({date:f.date, time:f.time, title:f.title, category:f.category, blocks:f.blocks});
        PDAdmin.log('추가: '+f.title+' '+dlabel(f.date), [pdId]);
        selectedDate = f.date; curYm = f.date.slice(0,7); adminRerender();
      });
      return;
    }
    var btn = ev.target.closest('.adm-row button');
    if(!btn) return;
    var row = btn.closest('.ev'); var e = row && events[parseInt(row.getAttribute('data-i'),10)];
    if(!e) return;
    var act = btn.getAttribute('data-act');
    if(act==='edit'){
      PDAdmin.openEdit({title:e.title, date:e.date, time:e.time, category:e.category, blocks:e.blocks}, function(f){
        var od = e.date;
        e.title = f.title; e.date = f.date; e.time = f.time; e.category = f.category; e.blocks = f.blocks;
        PDAdmin.log('수정: '+f.title+(od!==f.date?' ('+dlabel(od)+' → '+dlabel(f.date)+')':''), [pdId]);
        selectedDate = f.date; curYm = f.date.slice(0,7); adminRerender();
      });
    } else if(act==='move'){
      moving = e; renderCalendar(curYm); document.getElementById('calArea').scrollIntoView({behavior:'smooth', block:'start'});
    } else if(act==='del'){
      if(confirm('"'+e.title+'" ('+dlabel(e.date)+') 일정을 삭제할까요?')){
        events.splice(events.indexOf(e),1); PDAdmin.log('삭제: '+e.title+' '+dlabel(e.date), [pdId]); adminRerender();
      }
    }
  });
  document.addEventListener('dragstart', function(ev){
    if(!admin.on) return;
    var row = ev.target.closest && ev.target.closest('.ev[draggable="true"], .apill[draggable="true"]'); if(!row) return;
    ev.dataTransfer.setData('text/plain', row.getAttribute('data-i')); ev.dataTransfer.effectAllowed = 'move';
  });
  document.addEventListener('dragover', function(ev){
    if(!admin.on) return;
    var cell = ev.target.closest && ev.target.closest('.cal-cell:not(.pad)');
    if(cell){ ev.preventDefault(); cell.classList.add('droptarget'); }
  });
  document.addEventListener('dragleave', function(ev){
    var cell = ev.target.closest && ev.target.closest('.cal-cell'); if(cell) cell.classList.remove('droptarget');
  });
  document.addEventListener('drop', function(ev){
    if(!admin.on) return;
    var cell = ev.target.closest && ev.target.closest('.cal-cell:not(.pad)');
    if(!cell) return;
    ev.preventDefault(); cell.classList.remove('droptarget');
    var i = parseInt(ev.dataTransfer.getData('text/plain'),10);
    if(!isNaN(i) && events[i]){ moving = events[i]; doMove(cell.getAttribute('data-date')); }
  });

  if(!pdId){
    document.getElementById('calArea').innerHTML = '<div class="empty">PD가 지정되지 않았어요. <a href="index.html">PD 목록으로</a></div>';
  } else {
    PDSync.ready.then(load);
    PDSync.onUpdate(load);
  }
})();
</script>

</body>
</html>
