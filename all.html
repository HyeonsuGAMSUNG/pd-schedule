<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전체 스케쥴</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css?v=20261008c">
<style>
/* all.html 전용: HTML과 항상 같이 갱신되도록 인라인 */
.cal-cell.all{aspect-ratio:auto;min-height:112px;justify-content:flex-start;align-items:center;padding:6px 3px 5px}
.cal-cell .pnames{display:flex;flex-direction:column;align-items:stretch;width:100%;gap:0;margin-top:4px;flex:1}
.pgrp{display:flex;flex-wrap:wrap;justify-content:center;gap:3px 4px;width:100%}
.pn{white-space:nowrap;font-size:.68rem;font-weight:800;line-height:1.3;padding:1px 6px;border-radius:5px;background:var(--chip-bg);color:var(--muted)}
.pn.c{background:hsl(var(--h) 85% 88%);color:hsl(var(--h) 75% 24%)}
.pn.off{opacity:.55}
@media (prefers-color-scheme: dark){.pn.c{background:hsl(var(--h) 45% 26%);color:hsl(var(--h) 85% 82%)}}
.pgrp.int{margin-top:9px;padding:3px 2px 4px;border-top:2px solid var(--accent);background:var(--chip-bg);border-radius:0 0 7px 7px;gap:2px 5px;position:relative}
.pgrp.int::before{content:'통역';flex-basis:100%;text-align:center;font-size:.6rem;font-weight:900;letter-spacing:.06em;color:var(--accent);line-height:1.3}
.pgrp.int .pn{background:transparent;padding:0 1px;font-weight:700;color:var(--fg);opacity:.9}
.cal-cell .ccount{margin-top:auto;padding-top:3px;background:none;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:1.05rem;font-weight:700;line-height:1.2;text-align:center}
.pdlegend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.pdlegend .pn{font-size:.7rem}
@media (max-width:480px){
  .cal-cell.all{min-height:96px;padding:3px 1px 3px}
  .pgrp{gap:2px 2px}
  .pn{font-size:.56rem;padding:0 3px;letter-spacing:-0.3px}
  .pgrp.int{margin-top:6px;padding:2px 1px 3px}
  .pgrp.int::before{font-size:.5rem}
  .cal-cell .ccount{font-size:.88rem;padding-top:2px}
}
.pdchip.c{background:hsl(var(--h) 85% 90%);border-color:transparent;color:hsl(var(--h) 75% 24%)}
@media (prefers-color-scheme: dark){.pdchip.c{background:hsl(var(--h) 45% 26%);color:hsl(var(--h) 85% 82%)}}

/* ---- 관리자 편집 ---- */
.adm-btn{position:absolute;right:16px;bottom:12px;font:inherit;font-size:.7rem;font-weight:700;color:var(--muted);background:var(--chip-bg);border:1px solid var(--border);border-radius:999px;padding:4px 11px;cursor:pointer}
.adm-btn.on{color:var(--accent-fg);background:var(--accent);border-color:var(--accent)}
.admbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--accent);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;box-shadow:0 -4px 14px rgba(0,0,0,.18)}
.admbar .txt{flex:1;min-width:160px;font-size:.8rem;font-weight:700}
.admbar button,.adm-row button,.adm-add{font:inherit;font-size:.78rem;font-weight:700;border:1px solid var(--border);background:var(--chip-bg);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
.admbar button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.admbar button:disabled{opacity:.4;cursor:default}
.adm-row{display:flex;gap:6px;margin-top:2px;padding-left:62px}
.adm-row button{padding:3px 9px;font-size:.7rem}
.adm-row button.danger{color:var(--bad)}
.adm-add{margin-top:10px;width:100%}
.ev[draggable="true"]{cursor:grab}
.cal-cell.droptarget{outline:2px dashed var(--accent);outline-offset:-3px}
.movebanner{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-size:.82rem;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:space-between}
.movebanner button{font:inherit;font-size:.75rem;font-weight:700;border:1px solid var(--accent-fg);background:transparent;color:var(--accent-fg);border-radius:8px;padding:3px 10px;cursor:pointer}
.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:600px){.modal-bg{align-items:center}}
.modal{width:100%;max-width:460px;max-height:92vh;overflow:auto;background:var(--surface);color:var(--fg);border-radius:16px 16px 0 0;padding:18px 18px 22px}
@media (min-width:600px){.modal{border-radius:16px}}
.modal h3{font-size:1.05rem;margin-bottom:10px}
.modal label{display:block;margin-top:12px;font-size:.78rem;font-weight:700;color:var(--muted)}
.modal input[type=text],.modal input[type=password],.modal input[type=date],.modal input[type=time],.modal select{width:100%;margin-top:4px;font:inherit;font-size:.95rem;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--fg)}
.modal .chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.88rem;color:var(--fg);font-weight:500}
.modal .btns{display:flex;gap:8px;margin-top:18px}
.modal .btns button{flex:1;font:inherit;font-size:.9rem;font-weight:800;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--chip-bg);color:var(--fg);cursor:pointer}
.modal .btns button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.modal .hint{margin-top:10px;font-size:.74rem;color:var(--muted);line-height:1.55}
.modal .err{margin-top:10px;font-size:.8rem;font-weight:700;color:var(--bad)}
.modal .pdrow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:.85rem;font-weight:600;color:var(--fg)}
.modal .pdrow span{flex:1}
.modal .pdrow select{width:auto;margin:0;font-size:.82rem;padding:5px 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.82rem;font-weight:700;max-width:90vw}
body.adm-on{padding-bottom:90px}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="backlink" href="index.html">‹ PD 목록</a>
    <div class="brand">
      <h1>전체 스케쥴</h1>
      <span class="tag-rec">ALL</span>
    </div>
    <div class="sub" id="syncNote">데이터 불러오는 중…</div>
    <button type="button" class="adm-btn" id="admBtn">관리자</button>
  </div>
</header>

<div class="wrap">
  <div class="filters" id="filters"></div>
  <div id="conflictArea"></div>
  <div id="calArea"><div class="empty">일정 불러오는 중…</div></div>

  <div class="section-title"><h2>전체 일정</h2></div>
  <div class="month-nav" id="monthNav"></div>
  <div id="scheduleArea"></div>

  <footer>
    모든 PD의 일정을 한 화면에 합친 페이지예요. 같은 수업은 한 줄로 묶고, 참여하는 PD와 통역을 아래에 표시해요.
    겹침 표시는 시작 시각이 3시간 안으로 가까운 수업끼리 비교한 참고용이에요. 시간이 노션에 없는 수업은 19:00 기준이에요. 같은 사람(강의자·통역자 누구든)이 비슷한 시간에 두 수업에 잡힌 경우만 표시해요.
  </footer>
</div>

<script src="sync-status.js"></script>
<script>
(function(){
  var PD_IDS = ['michingamsung','heojunho','sinpureunsol','naseongjun','kimseonhwi','syunta','satsuki'];
  var CATS = {
    china:{label:'중국', hue:18},
    japan:{label:'일본', hue:350},
    korea:{label:'한국', hue:205},
    global1:{label:'글로벌 1기', hue:262},
    globalcareer:{label:'글로벌 커리어', hue:285},
    album:{label:'AI 아티스트', hue:40},
    jordan:{label:'조던쇼를 잡아라', hue:165},
    hitmakers:{label:'히트메이커스 멜법', hue:130},
    nova:{label:'노바 피드백', hue:0},
    openclass:{label:'오픈 특강', hue:95},
    holiday:{label:'공휴일/휴무', hue:210},
    beginner:{label:'초급반', hue:230},
    trackdesign:{label:'트랙디자인', hue:310},
    sunocomp:{label:'수노 작곡반', hue:70},
    demo:{label:'DEMO 메이킹 클래스 3기', hue:190},
    genre:{label:'장르특강', hue:150},
    tsm:{label:'일본 유학 TSM', hue:10},
    toplinefree:{label:'탑라인 무료특강', hue:330},
    ginger:{label:'진저브레드 글로벌1기', hue:55},
    bensamama:{label:'벤사마마 글로벌1기', hue:340},
    freelecture:{label:'무료특강', hue:180},
    sunolyric:{label:'수노 작사 특강', hue:100},
    aiartist:{label:'AI 아티스트', hue:25}
  };
  var DOW = ['일','월','화','수','목','금','토'];
  var WINDOW_MIN = 180;
  var PD_HUE = {michingamsung:270, naseongjun:48, heojunho:215, kimseonhwi:0};
  var SHORT = {michingamsung:'미친', heojunho:'준호', sinpureunsol:'푸른', naseongjun:'성준', kimseonhwi:'선휘', syunta:'슌타', satsuki:'사츠', honomi:'호노', ohani:'오하', kimdohyeon:'도현'};
  function shortName(id){ return SHORT[id] || (pdName[id]||id).slice(0,2); }

  var pds = [];           // [{id,name}]
  var pdName = {};
  var merged = [];        // merged class entries (all PDs)
  var active = {};        // pd id -> true (filter)
  var curYm = null, minYm = null, maxYm = null, selectedDate = null;
  var packs = [];
  var admin = {on:false, token:null, shas:{}};
  var moving = null, dirty = {}, pending = [];

  function pad(n){return String(n).length<2?'0'+n:String(n)}
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function dowOf(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]).getDay(); }
  function fmtKDate(s){ var p=s.split('-').map(Number); return p[1]+'월 '+p[2]+'일'; }
  function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
  function shiftYm(ym,d){
    var y=parseInt(ym.slice(0,4),10), m=parseInt(ym.slice(5,7),10)+d;
    while(m>12){m-=12;y++;} while(m<1){m+=12;y--;}
    return y+'-'+pad(m);
  }
  function mins(t){ var p=t.split(':'); return parseInt(p[0],10)*60+parseInt(p[1],10); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function isInterp(title){ return /통역/.test(title); }
  function cleanTitle(t){ return t.replace(/\s*\((마무리\/)?통역\)\s*$/,''); }

  function tagHtml(cat){
    var c = CATS[cat] || {label:cat, hue:0};
    return '<span class="tagc" style="--h:'+c.hue+'">'+esc(c.label)+'</span>';
  }

  // ---------- merge ----------
  function mergeAll(perPd){
    var map = {};
    var order = [];
    perPd.forEach(function(pack){
      pack.events.forEach(function(e){
        var role = isInterp(e.title) ? 'int' : 'main';
        var key = e.date+'|'+e.category+'|'+(e.time||'');
        var x = map[key];
        if(!x){
          x = map[key] = {key:key, date:e.date, time:e.time, category:e.category, title:e.title, titleRole:role, blocks:false, people:{}, offPeople:{}, srcs:[]};
          order.push(key);
        }
        x.srcs.push({e:e, pd:pack.id, role:role});
        if(role==='main' && x.titleRole==='int'){ x.title = e.title; x.titleRole = 'main'; }
        x.blocks = x.blocks || e.blocks;
        var bucket = e.blocks ? x.people : x.offPeople;
        if(!bucket[pack.id] || role==='main') bucket[pack.id] = role;
      });
    });
    return order.map(function(k){
      var x = map[k];
      if(x.titleRole==='int') x.title = cleanTitle(x.title);
      if(!x.blocks) x.people = x.offPeople;
      return x;
    }).sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?-1:1;
      return (a.time||'99:99').localeCompare(b.time||'99:99');
    });
  }

  // ---------- conflicts ----------
  // level 'person': the same person is in two classes that start close together
  function computeConflicts(list){
    var byDate = {};
    list.forEach(function(x){
      if(!x.blocks || !x.time) return;
      (byDate[x.date] = byDate[x.date] || []).push(x);
    });
    var out = [];
    Object.keys(byDate).sort().forEach(function(d){
      var l = byDate[d];
      for(var a=0;a<l.length;a++) for(var b=a+1;b<l.length;b++){
        var A=l[a], B=l[b];
        if(Math.abs(mins(A.time)-mins(B.time))>=WINDOW_MIN) continue;
        if(A.category===B.category) continue; // 같은 수업의 1부/2부
        var shared = Object.keys(A.people).filter(function(p){ return B.people[p]; });
        if(shared.length) out.push({date:d, level:'person', who:shared, a:A, b:B});
      }
    });
    return out;
  }

  var conflicts = [];
  var conflictByDate = {};
  function indexConflicts(){
    conflictByDate = {};
    conflicts.forEach(function(c){
      var cur = conflictByDate[c.date];
      if(!cur || c.level==='person') conflictByDate[c.date] = c.level;
    });
  }

  // ---------- filtering ----------
  function visibleEvents(){
    var anyOn = PD_IDS.some(function(id){ return active[id]; });
    if(!anyOn) return merged;
    return merged.filter(function(x){
      return Object.keys(x.people).some(function(p){ return active[p]; });
    });
  }
  function byDateMap(list){
    var m = {};
    list.forEach(function(x){ (m[x.date] = m[x.date] || []).push(x); });
    return m;
  }

  function peopleHtml(x){
    if(x.category==='holiday') return '';
    var ids = Object.keys(x.people).sort(function(a,b){ return PD_IDS.indexOf(a)-PD_IDS.indexOf(b); });
    var main = ids.filter(function(p){ return x.people[p]==='main'; });
    var intr = ids.filter(function(p){ return x.people[p]==='int'; });
    var html = main.map(function(p){ return PD_HUE[p]!==undefined ? '<span class="pdchip c" style="--h:'+PD_HUE[p]+'">'+esc(pdName[p]||p)+'</span>' : '<span class="pdchip">'+esc(pdName[p]||p)+'</span>'; }).join('');
    html += intr.map(function(p){ return '<span class="pdchip int">'+esc(pdName[p]||p)+' 통역</span>'; }).join('');
    return html ? '<div class="pdchips">'+html+'</div>' : '';
  }

  function conflictNoteFor(x){
    var notes = [];
    conflicts.forEach(function(c){
      if(c.a!==x && c.b!==x) return;
      var other = c.a===x ? c.b : c.a;
      if(c.level==='person'){
        notes.push('<div class="cnote person">⚠ '+c.who.map(function(p){return esc(pdName[p]||p);}).join(', ')+' 님이 '+esc(other.time)+' '+esc(cleanTitle(other.title))+'와(과) 시간이 겹쳐요</div>');
      } else {
        notes.push('<div class="cnote interp">통역 수업이 같은 시간대: '+esc(other.time)+' '+esc(cleanTitle(other.title))+'</div>');
      }
    });
    return notes.join('');
  }

  function rowHtml(x){
    var timeLabel = x.time ? x.time : '녹화';
    var adm = admin.on ? '<div class="adm-row"><button type="button" data-act="edit">수정</button><button type="button" data-act="move">날짜 이동</button><button type="button" data-act="del" class="danger">삭제</button></div>' : '';
    return '<div class="ev ev-all'+(x.blocks?'':' is-off')+'" data-key="'+esc(x.key)+'"'+(admin.on?' draggable="true"':'')+'>'
      + '<div class="ev-line"><span class="time mono">'+timeLabel+'</span>'
      + '<span class="title">'+esc(x.title)+'</span>'+tagHtml(x.category)+'</div>'
      + peopleHtml(x) + conflictNoteFor(x) + adm
      + '</div>';
  }

  // ---------- render ----------
  function renderFilters(){
    var anyOn = PD_IDS.some(function(id){ return active[id]; });
    var html = '<button type="button" class="fchip'+(anyOn?'':' on')+'" data-pd="*">전체</button>';
    html += pds.map(function(p){
      return '<button type="button" class="fchip'+(active[p.id]?' on':'')+'" data-pd="'+p.id+'">'+esc(p.name)+'</button>';
    }).join('');
    var box = document.getElementById('filters');
    box.innerHTML = html;
  }

  function renderConflictSummary(){
    var area = document.getElementById('conflictArea');
    var today = todayStr();
    var upcoming = conflicts.filter(function(c){ return c.date>=today; });
    if(!upcoming.length){
      area.innerHTML = '<div class="csum ok">앞으로 겹치는 일정이 없어요.</div>';
      return;
    }
    var nPerson = upcoming.filter(function(c){return c.level==='person';}).length;
    var nInterp = upcoming.length - nPerson;
    var items = upcoming.map(function(c){
      var d = fmtKDate(c.date)+' ('+DOW[dowOf(c.date)]+')';
      var txt = c.level==='person'
        ? '<b>⚠ '+c.who.map(function(p){return esc(pdName[p]||p);}).join(', ')+'</b> 동시 배정: '
        : '<b>통역 수업 동시간:</b> ';
      return '<li data-date="'+c.date+'"><span class="mono d">'+d+'</span> '+txt
        + esc(c.a.time)+' '+esc(cleanTitle(c.a.title))+' / '+esc(c.b.time)+' '+esc(cleanTitle(c.b.title))+'</li>';
    }).join('');
    area.innerHTML = '<details class="csum"><summary>겹침 참고 '+upcoming.length+'건'
      + (nPerson?' · <span class="red">같은 사람 '+nPerson+'</span>':'')
      + (nInterp?' · 통역 수업 동시간 '+nInterp:'')
      + '</summary><ul>'+items+'</ul></details>';
    area.querySelector('ul').addEventListener('click', function(ev){
      var li = ev.target.closest('li'); if(!li) return;
      var d = li.getAttribute('data-date');
      selectedDate = d; renderCalendar(d.slice(0,7));
      document.getElementById('calArea').scrollIntoView({behavior:'smooth', block:'start'});
    });
  }

  function dayDetailHtml(ds, dayMap){
    var evs = dayMap[ds] || [];
    var blocking = evs.filter(function(x){return x.blocks;});
    var cn = conflictByDate[ds];
    var pill = '<span class="pill '+(blocking.length?'busy':'free')+'">'+(blocking.length?('수업 '+blocking.length+'개'):'수업 없음')+'</span>';
    var warn = cn==='person' ? '<span class="pill warn">⚠ 같은 사람 겹침</span>' : (cn==='interp' ? '<span class="pill amber">통역 수업 동시간</span>' : '');
    return '<div class="dd-head">'+pill+warn+'<span class="dd-date mono">'+fmtKDate(ds)+' ('+DOW[dowOf(ds)]+')</span></div>'
      + (evs.length ? '<div class="dd-list">'+evs.map(rowHtml).join('')+'</div>' : '<div class="dd-empty">등록된 일정이 없어요.</div>')
      + (admin.on ? '<button type="button" class="adm-add" data-date="'+ds+'">+ 이 날짜에 일정 추가</button>' : '');
  }

  function renderCalendar(ym){
    curYm = ym;
    var y = parseInt(ym.slice(0,4),10), m = parseInt(ym.slice(5,7),10);
    var vis = visibleEvents();
    var dayMap = byDateMap(vis);
    var total = daysInMonth(y,m), firstDow = dowOf(ym+'-01'), today = todayStr();
    var cells = [];
    for(var i=0;i<firstDow;i++) cells.push('<div class="cal-cell pad"></div>');
    for(var d=1; d<=total; d++){
      var ds = ym+'-'+pad(d);
      var evs = dayMap[ds] || [];
      var blocking = evs.filter(function(x){return x.blocks;});
      var cls = 'cal-cell all '+(blocking.length?'has':'none');
      if(ds===today) cls += ' today';
      if(ds===selectedDate) cls += ' selected';
      var cn = conflictByDate[ds];
      var mark = cn==='person' ? '<span class="cmark person">!</span>' : (cn==='interp' ? '<span class="cmark interp">!</span>' : '');
      var src = blocking.length ? blocking : evs;
      var who = {};
      src.forEach(function(x){
        if(x.category==='holiday') return;
        Object.keys(x.people).forEach(function(p){
          if(who[p]!=='main') who[p] = x.people[p];
        });
      });
      function nameSpans(role){
        return PD_IDS.filter(function(p){ return who[p]===role; }).map(function(p){
          var colored = role==='main' && PD_HUE[p]!==undefined;
          return '<span class="pn'+(colored?' c':'')+(blocking.length?'':' off')+'"'+(colored?' style="--h:'+PD_HUE[p]+'"':'')+'>'
            + '<span class="nf">'+esc(pdName[p]||p)+'</span><span class="ns">'+esc(shortName(p))+'</span></span>';
        }).join('');
      }
      var mainHtml = nameSpans('main'), intHtml = nameSpans('int');
      var names = (mainHtml ? '<span class="pgrp">'+mainHtml+'</span>' : '')
        + (intHtml ? '<span class="pgrp int">'+intHtml+'</span>' : '');
      var cnt = blocking.length ? '<span class="ccount">'+blocking.length+'</span>' : '';
      cells.push('<div class="'+cls+'" data-date="'+ds+'">'+mark+'<span class="num">'+d+'</span>'
        +'<span class="pnames">'+names+'</span>'+cnt+'</div>');
    }
    var trailing = (7 - (cells.length % 7)) % 7;
    for(var t=0;t<trailing;t++) cells.push('<div class="cal-cell pad"></div>');

    var area = document.getElementById('calArea');
    area.innerHTML =
      '<div class="cal-nav"><button id="prevBtn" '+(ym<=minYm?'disabled':'')+'>‹</button>'
      + '<span class="label">'+y+'년 '+m+'월</span>'
      + '<button id="nextBtn" '+(ym>=maxYm?'disabled':'')+'>›</button></div>'
      + '<div class="legend"><span class="pdlegend"><span class="pn c" style="--h:270">미친감성</span><span class="pn c" style="--h:48">나성준</span><span class="pn c" style="--h:215">허준호</span><span class="pn c" style="--h:0">김선휘</span><span>위 = 강의·진행 / 아래 구분선 = 통역 / 큰 숫자 = 수업 수</span></span>'
      + '<span><span class="cmark person inline">!</span>같은 사람 겹침</span>'
      + '</div>'
      + (admin.on && moving ? '<div class="movebanner"><span>옮길 날짜를 눌러 주세요</span><button type="button" id="moveCancel">취소</button></div>' : '')
      + '<div class="cal-dow">'+DOW.map(function(w){return '<span>'+w+'</span>';}).join('')+'</div>'
      + '<div class="cal-grid" id="calGrid">'+cells.join('')+'</div>'
      + '<div class="day-detail" id="dayDetail"></div>';

    document.getElementById('prevBtn').addEventListener('click', function(){ if(ym>minYm) renderCalendar(shiftYm(ym,-1)); });
    document.getElementById('nextBtn').addEventListener('click', function(){ if(ym<maxYm) renderCalendar(shiftYm(ym,1)); });
    document.getElementById('calGrid').addEventListener('click', function(ev){
      var cell = ev.target.closest('.cal-cell');
      if(!cell || cell.classList.contains('pad')) return;
      if(admin.on && moving){ doMove(moving, cell.getAttribute('data-date')); return; }
      selectedDate = cell.getAttribute('data-date');
      renderCalendar(curYm);
    });
    var mc = document.getElementById('moveCancel');
    if(mc) mc.addEventListener('click', function(){ moving = null; renderCalendar(curYm); });
    document.getElementById('dayDetail').innerHTML = (selectedDate && selectedDate.slice(0,7)===ym)
      ? dayDetailHtml(selectedDate, dayMap)
      : '<div class="dd-empty">날짜를 눌러서 그날 모든 PD의 일정을 확인해요.</div>';
  }

  function renderSchedule(){
    var vis = visibleEvents();
    var months = {};
    vis.forEach(function(x){
      var mk = x.date.slice(0,7);
      months[mk] = months[mk] || {};
      (months[mk][x.date] = months[mk][x.date] || []).push(x);
    });
    var mks = Object.keys(months).sort(), today = todayStr();
    document.getElementById('monthNav').innerHTML = mks.map(function(mk){
      return '<a href="#m-'+mk+'">'+parseInt(mk.slice(5,7),10)+'월</a>';
    }).join('');
    document.getElementById('scheduleArea').innerHTML = mks.map(function(mk){
      var daysHtml = Object.keys(months[mk]).sort().map(function(dk){
        var isToday = dk===today, cn = conflictByDate[dk];
        var badge = cn==='person' ? '<span class="cmark person inline">!</span>' : (cn==='interp' ? '<span class="cmark interp inline">!</span>' : '');
        return '<div class="day"><div class="day-head"><span class="date-num">'+parseInt(dk.slice(5,7),10)+'/'+parseInt(dk.slice(8,10),10)+'</span>'
          + '<span class="dow">('+DOW[dowOf(dk)]+')</span>'+(isToday?'<span class="today-mark">오늘</span>':'')+badge+'</div>'
          + months[mk][dk].map(rowHtml).join('')+'</div>';
      }).join('');
      return '<div class="month" id="m-'+mk+'"><h3>'+mk.slice(0,4)+'년 '+parseInt(mk.slice(5,7),10)+'월</h3>'+daysHtml+'</div>';
    }).join('');
  }

  function renderAll(){
    renderFilters();
    renderConflictSummary();
    var vis = visibleEvents();
    if(!vis.length){
      document.getElementById('calArea').innerHTML = '<div class="empty">표시할 일정이 없어요.</div>';
      document.getElementById('scheduleArea').innerHTML = '';
      return;
    }
    var todayYm = todayStr().slice(0,7);
    var keep = (curYm && curYm>=minYm && curYm<=maxYm) ? curYm : ((todayYm>=minYm && todayYm<=maxYm) ? todayYm : minYm);
    renderCalendar(keep);
    renderSchedule();
  }

  document.getElementById('filters').addEventListener('click', function(ev){
    var b = ev.target.closest('.fchip'); if(!b) return;
    var id = b.getAttribute('data-pd');
    if(id==='*') PD_IDS.forEach(function(p){ active[p]=false; });
    else active[id] = !active[id];
    renderAll();
  });

  function load(){
    if(admin.on) return Promise.resolve();
    return fetch(PDSync.bust('data/pds.json'), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(list){
      pds = list;
      pdName = {};
      list.forEach(function(p){ pdName[p.id] = p.name.replace(/\s*PD$/,''); });
      PD_IDS = list.map(function(p){ return p.id; });
      return Promise.all(list.map(function(p){
        return fetch(PDSync.bust('data/'+p.id+'.json'), {cache:'no-store'})
          .then(function(r){ return r.ok ? r.json() : []; })
          .catch(function(){ return []; })
          .then(function(ev){ return {id:p.id, events:ev}; });
      }));
    }).then(function(loaded){
      packs = loaded; tagPacks();
      var n = 0; packs.forEach(function(p){ n += p.events.length; });
      merged = mergeAll(packs);
      conflicts = computeConflicts(merged);
      indexConflicts();
      if(!merged.length){
        document.getElementById('syncNote').textContent = '등록된 일정이 없어요.';
        document.getElementById('calArea').innerHTML = '<div class="empty">아직 등록된 일정이 없어요.</div>';
        return;
      }
      minYm = merged[0].date.slice(0,7);
      maxYm = merged[merged.length-1].date.slice(0,7);
      document.getElementById('syncNote').textContent = 'PD '+packs.length+'명 · 수업 '+merged.length+'개 (PD별 등록 '+n+'건을 합침)';
      renderAll();
    }).catch(function(){
      document.getElementById('syncNote').textContent = '일정을 불러오지 못했어요.';
      document.getElementById('calArea').innerHTML = '<div class="empty">일정 파일을 불러오지 못했어요.</div>';
    });
  }
  // =====================================================================
  // 관리자 편집: 비밀번호로 잠금 해제 → 눌러서/끌어서 일정 이동 → GitHub에 저장
  //  - 비밀번호는 서버로 보내지 않고, 이 브라우저에 암호화해 둔 GitHub 토큰을 여는 데만 써요.
  //  - 저장은 GitHub API로 data/*.json 파일을 직접 수정(commit)하는 방식이라 Claude와 무관하게 동작해요.
  // =====================================================================
  var GH = {owner:'HyeonsuGAMSUNG', repo:'pd-schedule', branch:'main'};
  var LS_KEY = 'pd_admin_v1';

  function tagPacks(){
    packs.forEach(function(p){
      p.events.forEach(function(e){ Object.defineProperty(e, '_pd', {value:p.id, writable:true, enumerable:false, configurable:true}); });
    });
  }

  function b64e(str){
    var bytes = new TextEncoder().encode(str), bin = '';
    for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64d(b64){
    var bin = atob(b64.replace(/\s/g,'')), bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function u8ToB64(u8){ var s=''; for(var i=0;i<u8.length;i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function b64ToU8(b){ var s=atob(b), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }

  function deriveKey(pw, salt){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(km){
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:250000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    });
  }
  function encryptToken(token, pw){
    var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    return deriveKey(pw, salt).then(function(key){
      return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, new TextEncoder().encode(token));
    }).then(function(buf){
      return {s:u8ToB64(salt), i:u8ToB64(iv), c:u8ToB64(new Uint8Array(buf))};
    });
  }
  function decryptToken(blob, pw){
    return deriveKey(pw, b64ToU8(blob.s)).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToU8(blob.i)}, key, b64ToU8(blob.c));
    }).then(function(buf){ return new TextDecoder().decode(buf); });
  }
  function getBlob(){ try{ var v = localStorage.getItem(LS_KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function setBlob(b){ try{ localStorage.setItem(LS_KEY, JSON.stringify(b)); return true; }catch(e){ return false; } }
  function clearBlob(){ try{ localStorage.removeItem(LS_KEY); }catch(e){} }

  function gh(path, opt){
    opt = opt || {};
    var headers = {'Accept':'application/vnd.github+json', 'Authorization':'Bearer '+admin.token};
    if(opt.body) headers['Content-Type'] = 'application/json';
    return fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+path, {method:opt.method||'GET', headers:headers, body:opt.body, cache:'no-store'});
  }

  // ---------- 모달/토스트 ----------
  function toast(msg){
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 4200);
  }
  function openModal(html){
    closeModal();
    var bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'modalBg';
    bg.innerHTML = '<div class="modal" role="dialog">'+html+'</div>';
    bg.addEventListener('click', function(ev){ if(ev.target===bg) closeModal(); });
    document.body.appendChild(bg);
    return bg.firstChild;
  }
  function closeModal(){ var b = document.getElementById('modalBg'); if(b) b.parentNode.removeChild(b); }

  // ---------- 잠금 해제 / 최초 설정 ----------
  function showAuth(){
    var blob = getBlob();
    if(!window.crypto || !crypto.subtle){ toast('이 브라우저에서는 관리자 기능을 쓸 수 없어요 (https 필요)'); return; }
    if(blob){
      var m = openModal('<h3>관리자 잠금 해제</h3><label>비밀번호<input type="password" id="admPw" autocomplete="current-password"></label>'
        + '<div class="err" id="admErr" style="display:none"></div>'
        + '<div class="btns"><button type="button" id="admCancel">취소</button><button type="button" class="pri" id="admOk">열기</button></div>'
        + '<div class="hint"><a href="#" id="admReset">이 기기의 관리자 설정 지우기</a></div>');
      var pw = m.querySelector('#admPw'); pw.focus();
      function go(){
        var err = m.querySelector('#admErr'); err.style.display = 'none';
        decryptToken(blob, pw.value).then(function(tok){ unlock(tok); }).catch(function(){
          err.textContent = '비밀번호가 맞지 않아요.'; err.style.display = 'block';
        });
      }
      m.querySelector('#admOk').addEventListener('click', go);
      pw.addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });
      m.querySelector('#admCancel').addEventListener('click', closeModal);
      m.querySelector('#admReset').addEventListener('click', function(e){
        e.preventDefault();
        if(confirm('이 기기에 저장된 관리자 설정(암호화된 토큰)을 지울까요?')){ clearBlob(); closeModal(); toast('관리자 설정을 지웠어요'); }
      });
    } else {
      var s = openModal('<h3>관리자 최초 설정 (이 기기에서 1번만)</h3>'
        + '<label>GitHub 토큰<input type="password" id="admTok" autocomplete="off" placeholder="github_pat_..."></label>'
        + '<label>새 관리자 비밀번호<input type="password" id="admPw1" autocomplete="new-password"></label>'
        + '<label>비밀번호 확인<input type="password" id="admPw2" autocomplete="new-password"></label>'
        + '<div class="err" id="admErr" style="display:none"></div>'
        + '<div class="btns"><button type="button" id="admCancel">취소</button><button type="button" class="pri" id="admOk">저장하고 열기</button></div>'
        + '<div class="hint">토큰은 GitHub → Settings → Developer settings → Fine-grained tokens에서 이 저장소(pd-schedule)만 선택하고 <b>Contents: Read and write</b> 권한으로 만들어요. 토큰은 비밀번호로 암호화되어 <b>이 기기 브라우저에만</b> 저장되고, 서버로 보내지지 않아요. 다른 기기에서는 그 기기에서 한 번 더 설정해야 해요.</div>');
      s.querySelector('#admCancel').addEventListener('click', closeModal);
      s.querySelector('#admOk').addEventListener('click', function(){
        var err = s.querySelector('#admErr'); err.style.display = 'none';
        var tok = s.querySelector('#admTok').value.trim(), p1 = s.querySelector('#admPw1').value, p2 = s.querySelector('#admPw2').value;
        function fail(t){ err.textContent = t; err.style.display = 'block'; }
        if(!tok) return fail('토큰을 입력해 주세요.');
        if(p1.length < 8) return fail('비밀번호는 8자 이상으로 해 주세요.');
        if(p1 !== p2) return fail('비밀번호 확인이 달라요.');
        admin.token = tok;
        gh('').then(function(r){
          if(!r.ok) throw new Error('토큰으로 저장소에 접근할 수 없어요 ('+r.status+').');
          return r.json();
        }).then(function(repo){
          if(!repo.permissions || !repo.permissions.push) throw new Error('이 토큰에는 쓰기 권한(Contents: Read and write)이 없어요.');
          return encryptToken(tok, p1);
        }).then(function(blob){
          if(!setBlob(blob)) throw new Error('이 브라우저에 저장할 수 없어요 (사생활 보호 모드?).');
          unlock(tok);
        }).catch(function(e){ admin.token = null; fail(e.message || '설정에 실패했어요.'); });
      });
    }
  }

  function unlock(tok){
    admin.token = tok;
    var m = openModal('<h3>일정 불러오는 중…</h3><div class="hint">GitHub에서 최신 일정을 직접 읽어 와요.</div>');
    loadFromGithub().then(function(){
      admin.on = true; dirty = {}; pending = []; moving = null;
      document.body.classList.add('adm-on');
      var b = document.getElementById('admBtn'); b.textContent = '편집 중'; b.classList.add('on');
      closeModal(); buildAdminBar(); rebuild();
      toast('편집 모드예요. 일정을 끌어서 날짜 칸에 놓거나 [수정]을 눌러요.');
    }).catch(function(e){ admin.token = null; closeModal(); toast('불러오기에 실패했어요: '+(e.message||e)); });
  }

  function lockAdmin(){
    if(Object.keys(dirty).length && !confirm('저장하지 않은 변경이 있어요. 버리고 나갈까요?')) return;
    admin.on = false; admin.token = null; moving = null; dirty = {}; pending = [];
    document.body.classList.remove('adm-on');
    var b = document.getElementById('admBtn'); b.textContent = '관리자'; b.classList.remove('on');
    var bar = document.getElementById('admBar'); if(bar) bar.parentNode.removeChild(bar);
    load();
  }

  function loadFromGithub(){
    return Promise.all(pds.map(function(p){
      return gh('/contents/data/'+p.id+'.json?ref='+GH.branch).then(function(r){
        if(!r.ok) throw new Error(p.id+'.json 읽기 실패 ('+r.status+')');
        return r.json();
      }).then(function(j){
        admin.shas[p.id] = j.sha;
        return {id:p.id, events:JSON.parse(b64d(j.content))};
      });
    })).then(function(loaded){ packs = loaded; tagPacks(); });
  }

  // ---------- 하단 관리자 바 ----------
  function buildAdminBar(){
    var bar = document.getElementById('admBar');
    if(!bar){ bar = document.createElement('div'); bar.id = 'admBar'; bar.className = 'admbar'; document.body.appendChild(bar); }
    bar.innerHTML = '<span class="txt" id="admTxt"></span>'
      + '<button type="button" id="admUndo">되돌리기</button>'
      + '<button type="button" class="pri" id="admSave">저장</button>'
      + '<button type="button" id="admOut">나가기</button>';
    bar.querySelector('#admSave').addEventListener('click', saveAll);
    bar.querySelector('#admUndo').addEventListener('click', function(){
      if(!Object.keys(dirty).length) return;
      if(!confirm('저장하지 않은 변경을 모두 되돌릴까요?')) return;
      loadFromGithub().then(function(){ dirty = {}; pending = []; moving = null; rebuild(); toast('되돌렸어요'); });
    });
    bar.querySelector('#admOut').addEventListener('click', lockAdmin);
    updateAdminBar();
  }
  function updateAdminBar(){
    if(!admin.on) return;
    var n = pending.length, t = document.getElementById('admTxt');
    if(t) t.textContent = n ? ('저장 안 된 변경 '+n+'건') : '편집 모드 · 변경 없음';
    var sv = document.getElementById('admSave'), un = document.getElementById('admUndo');
    if(sv) sv.disabled = !n; if(un) un.disabled = !n;
  }

  // ---------- 다시 그리기 ----------
  function rebuild(){
    merged = mergeAll(packs);
    conflicts = computeConflicts(merged);
    indexConflicts();
    if(merged.length){ minYm = merged[0].date.slice(0,7); maxYm = merged[merged.length-1].date.slice(0,7); }
    if(selectedDate){ if(selectedDate.slice(0,7) < minYm) minYm = selectedDate.slice(0,7); if(selectedDate.slice(0,7) > maxYm) maxYm = selectedDate.slice(0,7); }
    renderAll(); updateAdminBar();
  }
  function findX(key){ for(var i=0;i<merged.length;i++) if(merged[i].key===key) return merged[i]; return null; }
  function dlabel(ds){ var p=ds.split('-').map(Number); return p[1]+'/'+p[2]+'('+DOW[dowOf(ds)]+')'; }

  // ---------- 편집 동작 ----------
  function doMove(key, newDate){
    var x = findX(key); moving = null;
    if(!x || x.date===newDate){ renderCalendar(curYm); return; }
    var old = x.date;
    applyEdit(x, {title:x.title, date:newDate, time:x.time, category:x.category, blocks:x.blocks});
    pending.push('이동: '+cleanTitle(x.title)+' '+dlabel(old)+' → '+dlabel(newDate));
    selectedDate = newDate; curYm = newDate.slice(0,7);
    rebuild();
  }
  function applyEdit(x, f){
    var titleChanged = f.title !== x.title;
    x.srcs.forEach(function(s){
      var e = s.e;
      e.date = f.date; e.time = f.time || null; e.category = f.category;
      if(f.blocks !== x.blocks && e.blocks === x.blocks) e.blocks = f.blocks;
      if(titleChanged && e.blocks === (f.blocks)){ e.title = s.role==='int' ? cleanTitle(f.title)+' (통역)' : f.title; }
      dirty[s.pd] = true;
    });
  }
  function deleteX(x){
    x.srcs.forEach(function(s){
      var p = packs.filter(function(q){ return q.id===s.pd; })[0];
      var i = p.events.indexOf(s.e); if(i>=0) p.events.splice(i,1);
      dirty[s.pd] = true;
    });
  }
  function catOptions(sel){
    return Object.keys(CATS).map(function(k){ return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+esc(CATS[k].label)+'</option>'; }).join('');
  }
  function openEdit(x){
    var m = openModal('<h3>일정 수정</h3>'
      + '<label>제목<input type="text" id="fTitle" value="'+esc(cleanTitle(x.title)).replace(/"/g,'&quot;')+'"></label>'
      + '<label>날짜<input type="date" id="fDate" value="'+x.date+'"></label>'
      + '<label>시간 (비우면 시간 없음)<input type="time" id="fTime" value="'+(x.time||'')+'"></label>'
      + '<label>분류<select id="fCat">'+catOptions(x.category)+'</select></label>'
      + '<label class="chk"><input type="checkbox" id="fBlocks"'+(x.blocks?' checked':'')+'> 수업 있음 (체크 해제하면 일정 아님·초록색)</label>'
      + '<div class="btns"><button type="button" id="fCancel">취소</button><button type="button" class="pri" id="fOk">적용</button></div>');
    m.querySelector('#fCancel').addEventListener('click', closeModal);
    m.querySelector('#fOk').addEventListener('click', function(){
      var title = m.querySelector('#fTitle').value.trim(), date = m.querySelector('#fDate').value;
      if(!title || !date){ toast('제목과 날짜를 입력해 주세요'); return; }
      var f = {title:title, date:date, time:m.querySelector('#fTime').value || null, category:m.querySelector('#fCat').value, blocks:m.querySelector('#fBlocks').checked};
      var origTitle = x.title, origDate = x.date;
      var same = (cleanTitle(origTitle)===title);
      if(same) f.title = x.title;
      applyEdit(x, f);
      pending.push('수정: '+title+(origDate!==date?' ('+dlabel(origDate)+' → '+dlabel(date)+')':''));
      selectedDate = date; curYm = date.slice(0,7);
      closeModal(); rebuild();
    });
  }
  function openAdd(date){
    var rows = pds.map(function(p){
      return '<div class="pdrow"><span>'+esc(pdName[p.id]||p.id)+'</span><select data-pd="'+p.id+'"><option value="">-</option><option value="main">강의·진행</option><option value="int">통역</option></select></div>';
    }).join('');
    var m = openModal('<h3>일정 추가</h3>'
      + '<label>제목<input type="text" id="aTitle" placeholder="예: AI 아티스트 9회차"></label>'
      + '<label>날짜<input type="date" id="aDate" value="'+(date||'')+'"></label>'
      + '<label>시간 (비우면 시간 없음)<input type="time" id="aTime" value="19:00"></label>'
      + '<label>분류<select id="aCat">'+catOptions('album')+'</select></label>'
      + '<label class="chk"><input type="checkbox" id="aBlocks" checked> 수업 있음</label>'
      + '<label>참여 PD (최소 1명)</label>'+rows
      + '<div class="btns"><button type="button" id="aCancel">취소</button><button type="button" class="pri" id="aOk">추가</button></div>');
    m.querySelector('#aCancel').addEventListener('click', closeModal);
    m.querySelector('#aOk').addEventListener('click', function(){
      var title = m.querySelector('#aTitle').value.trim(), d = m.querySelector('#aDate').value;
      var who = [].slice.call(m.querySelectorAll('select[data-pd]')).filter(function(s){ return s.value; }).map(function(s){ return {pd:s.getAttribute('data-pd'), role:s.value}; });
      if(!title || !d){ toast('제목과 날짜를 입력해 주세요'); return; }
      if(!who.length){ toast('참여 PD를 1명 이상 골라 주세요'); return; }
      var time = m.querySelector('#aTime').value || null, cat = m.querySelector('#aCat').value, blocks = m.querySelector('#aBlocks').checked;
      who.forEach(function(w){
        var p = packs.filter(function(q){ return q.id===w.pd; })[0];
        var e = {date:d, time:time, title:(w.role==='int' ? cleanTitle(title)+' (통역)' : title), category:cat, blocks:blocks};
        Object.defineProperty(e, '_pd', {value:w.pd, writable:true, enumerable:false, configurable:true});
        p.events.push(e); dirty[w.pd] = true;
      });
      pending.push('추가: '+title+' '+dlabel(d));
      selectedDate = d; curYm = d.slice(0,7);
      closeModal(); rebuild();
    });
  }

  // ---------- 저장 ----------
  function serialize(arr){
    var a = arr.slice().sort(function(x,y){
      if(x.date!==y.date) return x.date<y.date?-1:1;
      var tx = x.time||'', ty = y.time||''; return tx<ty?-1:(tx>ty?1:0);
    });
    if(!a.length) return '[]\n';
    return '[\n'+a.map(function(e){ return JSON.stringify(e); }).join(',\n')+'\n]\n';
  }
  function saveAll(){
    var ids = Object.keys(dirty);
    if(!ids.length) return;
    var sv = document.getElementById('admSave'); sv.disabled = true; sv.textContent = '저장 중…';
    var summary = pending.slice(0,3).join(', ')+(pending.length>3?' 외 '+(pending.length-3)+'건':'');
    var chain = Promise.resolve();
    ids.forEach(function(id){
      chain = chain.then(function(){
        var p = packs.filter(function(q){ return q.id===id; })[0];
        return gh('/contents/data/'+id+'.json', {method:'PUT', body:JSON.stringify({
          message:'admin: '+summary+' ['+id+']', content:b64e(serialize(p.events)), sha:admin.shas[id], branch:GH.branch
        })}).then(function(r){
          if(r.status===409 || r.status===422) throw new Error('다른 곳에서 먼저 일정이 바뀌었어요. [되돌리기]로 최신 일정을 다시 불러온 뒤 다시 편집해 주세요.');
          if(!r.ok) throw new Error('저장 실패 ('+r.status+')');
          return r.json();
        }).then(function(j){ admin.shas[id] = j.content.sha; delete dirty[id]; });
      });
    });
    chain.then(function(){
      pending = []; sv.textContent = '저장'; updateAdminBar();
      toast('저장했어요. 1분쯤 뒤 모든 사람 화면에 반영돼요.');
    }).catch(function(e){
      sv.textContent = '저장'; sv.disabled = false; updateAdminBar(); toast(e.message || '저장에 실패했어요');
    });
  }

  // ---------- 이벤트 연결 ----------
  document.getElementById('admBtn').addEventListener('click', function(){
    if(admin.on){ lockAdmin(); } else { showAuth(); }
  });
  document.addEventListener('click', function(ev){
    if(!admin.on) return;
    var add = ev.target.closest('.adm-add');
    if(add){ openAdd(add.getAttribute('data-date')); return; }
    var btn = ev.target.closest('.adm-row button');
    if(!btn) return;
    var row = btn.closest('.ev'); var x = row && findX(row.getAttribute('data-key'));
    if(!x) return;
    var act = btn.getAttribute('data-act');
    if(act==='edit') openEdit(x);
    else if(act==='move'){ moving = x.key; renderCalendar(curYm); document.getElementById('calArea').scrollIntoView({behavior:'smooth', block:'start'}); }
    else if(act==='del'){
      if(confirm('"'+cleanTitle(x.title)+'" ('+dlabel(x.date)+') 일정을 삭제할까요?')){
        deleteX(x); pending.push('삭제: '+cleanTitle(x.title)+' '+dlabel(x.date)); rebuild();
      }
    }
  });
  document.addEventListener('dragstart', function(ev){
    if(!admin.on) return;
    var row = ev.target.closest && ev.target.closest('.ev[draggable="true"]'); if(!row) return;
    ev.dataTransfer.setData('text/plain', row.getAttribute('data-key')); ev.dataTransfer.effectAllowed = 'move';
  });
  document.addEventListener('dragover', function(ev){
    if(!admin.on) return;
    var cell = ev.target.closest && ev.target.closest('.cal-cell:not(.pad)');
    if(cell){ ev.preventDefault(); cell.classList.add('droptarget'); }
  });
  document.addEventListener('dragleave', function(ev){
    var cell = ev.target.closest && ev.target.closest('.cal-cell'); if(cell) cell.classList.remove('droptarget');
  });
  document.addEventListener('drop', function(ev){
    if(!admin.on) return;
    var cell = ev.target.closest && ev.target.closest('.cal-cell:not(.pad)');
    if(!cell) return;
    ev.preventDefault(); cell.classList.remove('droptarget');
    var key = ev.dataTransfer.getData('text/plain');
    if(key) doMove(key, cell.getAttribute('data-date'));
  });
  window.addEventListener('beforeunload', function(ev){
    if(admin.on && Object.keys(dirty).length){ ev.preventDefault(); ev.returnValue = ''; }
  });

  PDSync.ready.then(load);
  PDSync.onUpdate(load);
})();
</script>

</body>
