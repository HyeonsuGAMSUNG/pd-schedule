<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전체 스케쥴</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css?v=20261015b">
<style>
/* all.html 전용: HTML과 항상 같이 갱신되도록 인라인 */
.cal-cell.all{aspect-ratio:auto;min-height:112px;justify-content:flex-start;align-items:center;padding:6px 3px 5px}
.cal-cell .pnames{display:flex;flex-direction:column;align-items:stretch;width:100%;gap:0;margin-top:4px;flex:1}
.pgrp{display:flex;flex-wrap:wrap;justify-content:center;gap:3px 4px;width:100%}
.pn{white-space:nowrap;font-size:.68rem;font-weight:800;line-height:1.3;padding:1px 6px;border-radius:5px;background:var(--chip-bg);color:var(--muted)}
.pn.c{background:hsl(var(--h) 85% 88%);color:hsl(var(--h) 75% 24%)}
.pn.off{opacity:.55}
@media (prefers-color-scheme: dark){.pn.c{background:hsl(var(--h) 45% 26%);color:hsl(var(--h) 85% 82%)}}
.pgrp.int{margin-top:9px;padding:3px 2px 4px;border-top:2px solid var(--accent);background:var(--chip-bg);border-radius:0 0 7px 7px;gap:2px 5px;position:relative}
.pgrp.int::before{content:'통역';flex-basis:100%;text-align:center;font-size:.6rem;font-weight:900;letter-spacing:.06em;color:var(--accent);line-height:1.3}
.pgrp.int .pn{background:transparent;padding:0 1px;font-weight:700;color:var(--fg);opacity:.9}
.cal-cell .ccount{margin-top:auto;padding-top:3px;background:none;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:1.05rem;font-weight:700;line-height:1.2;text-align:center}
.pdlegend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.pdlegend .pn{font-size:.7rem}
@media (max-width:480px){
  .cal-cell.all{min-height:96px;padding:3px 1px 3px}
  .pgrp{gap:2px 2px}
  .pn{font-size:.56rem;padding:0 3px;letter-spacing:-0.3px}
  .pgrp.int{margin-top:6px;padding:2px 1px 3px}
  .pgrp.int::before{font-size:.5rem}
  .cal-cell .ccount{font-size:.88rem;padding-top:2px}
}
.pdchip.c{background:hsl(var(--h) 85% 90%);border-color:transparent;color:hsl(var(--h) 75% 24%)}
@media (prefers-color-scheme: dark){.pdchip.c{background:hsl(var(--h) 45% 26%);color:hsl(var(--h) 85% 82%)}}
.viewtabs{display:flex;gap:6px;margin-bottom:10px}
.vtab{flex:1;padding:9px 8px;border-radius:9px;border:1px solid var(--border);background:var(--chip-bg);color:var(--muted);font-weight:800;font-size:.82rem;cursor:pointer}
.vtab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pdchip.rev{border-style:dotted;border-color:#2f9e5b;color:#2f9e5b}
@media (prefers-color-scheme: dark){.pdchip.rev{color:#6fd99a;border-color:#6fd99a}}

</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="backlink" href="index.html">‹ PD 목록</a>
    <div class="brand">
      <h1 id="pageTitle">전체 스케쥴</h1>
      <span class="tag-rec" id="pageTag">ALL</span>
    </div>
    <div class="sub" id="syncNote">데이터 불러오는 중…</div>
    <button type="button" class="adm-btn" id="admBtn">관리자</button>
  </div>
</header>

<div class="wrap">
  <div class="viewtabs" id="viewTabs">
    <button type="button" class="vtab" data-view="all">전체 스케쥴</button>
    <button type="button" class="vtab" data-view="interp">🌏 한중일 통역 수업</button>
  </div>
  <div class="filters" id="filters"></div>
  <div id="conflictArea"></div>
  <div id="calArea"><div class="empty">일정 불러오는 중…</div></div>

  <div class="section-title"><h2 id="listTitle">전체 일정</h2></div>
  <div class="month-nav" id="monthNav"></div>
  <div id="scheduleArea"></div>

  <footer id="pageFooter">
    모든 PD의 일정을 한 화면에 합친 페이지예요. 같은 수업은 한 줄로 묶고, 참여하는 PD와 통역을 아래에 표시해요.
    겹침 표시는 시작 시각이 3시간 안으로 가까운 수업끼리 비교한 참고용이에요. 시간이 노션에 없는 수업은 19:00 기준이에요. 같은 사람(강의자·통역자 누구든)이 비슷한 시간에 두 수업에 잡힌 경우만 표시해요.
  </footer>
</div>

<script src="sync-status.js"></script>
<script src="admin.js?v=2"></script>
<script>
(function(){
  var PD_IDS = ['michingamsung','heojunho','sinpureunsol','naseongjun','kimseonhwi','syunta','satsuki'];
  var CATS = {
    china:{label:'중국', hue:18},
    japan:{label:'일본', hue:350},
    korea:{label:'한국', hue:205},
    global1:{label:'글로벌 1기', hue:262},
    globalcareer:{label:'글로벌 커리어', hue:285},
    album:{label:'AI 아티스트', hue:40},
    jordan:{label:'조던쇼를 잡아라', hue:165},
    hitmakers:{label:'히트메이커스 멜법', hue:130},
    nova:{label:'노바 피드백', hue:0},
    openclass:{label:'오픈 특강', hue:95},
    holiday:{label:'공휴일/휴무', hue:210},
    beginner:{label:'초급반', hue:230},
    trackdesign:{label:'트랙디자인', hue:310},
    sunocomp:{label:'수노 작곡반', hue:70},
    demo:{label:'DEMO 메이킹 클래스 3기', hue:190},
    genre:{label:'장르특강', hue:150},
    tsm:{label:'일본 유학 TSM', hue:10},
    toplinefree:{label:'탑라인 무료특강', hue:330},
    ginger:{label:'진저브레드 글로벌1기', hue:55},
    bensamama:{label:'벤사마마 글로벌1기', hue:340},
    freelecture:{label:'무료특강', hue:180},
    sunolyric:{label:'수노 작사 법칙', hue:100},
    aiartist:{label:'AI 아티스트', hue:25},
    mentor:{label:'GP1 한국 멘토', hue:250},
    dinner:{label:'치킨 모임', hue:20}
  };
  // 한중일(통역) 수업: 구조상 늘 통역이 필요한 카테고리 — 통역자가 아직 배정 안 돼도 이 탭에는 잡혀서 빠진 걸 바로 알 수 있어요.
  var ALWAYS_INTERP_CATS = {china:1, japan:1, global1:1, globalcareer:1, trackdesign:1, jordan:1, hitmakers:1, ginger:1, bensamama:1, tsm:1, toplinefree:1, mentor:1};
  // 카테고리가 freelecture 등으로 따로 잡혀도 이 프로그램들의 무료특강/부속 행사는 늘 한중일 수업이에요.
  var ALWAYS_INTERP_TITLE_RE = /히트메이커스|트랙디자인/;
  function isAlwaysInterp(x){ return !!ALWAYS_INTERP_CATS[x.category] || ALWAYS_INTERP_TITLE_RE.test(x.title); }
  function isInterpClass(x){
    if(isAlwaysInterp(x)) return true;
    return Object.keys(x.people).some(function(p){ return x.people[p]==='int'; });
  }
  function missingInterpNote(x){
    if(!interpMode || !x.blocks || !isAlwaysInterp(x)) return '';
    var hasInt = Object.keys(x.people).some(function(p){ return x.people[p]==='int'; });
    var hasRev = Object.keys(x.people).some(function(p){ return x.people[p]==='rev'; });
    return (hasInt ? '' : '<div class="cnote interp">⚠ 아직 통역자가 배정 안 됐어요</div>')
      + (hasRev ? '' : '<div class="cnote interp">⚠ 아직 원어민 검수자가 배정 안 됐어요</div>');
  }
  var interpMode = /(^|[?&])view=interp(&|$)/.test(location.search);
  var DOW = ['일','월','화','수','목','금','토'];
  var WINDOW_MIN = 180;
  var PD_HUE = {michingamsung:270, naseongjun:48, heojunho:215, kimseonhwi:0};
  var SHORT = {michingamsung:'미친', heojunho:'준호', sinpureunsol:'푸른', naseongjun:'성준', kimseonhwi:'선휘', syunta:'슌타', satsuki:'사츠', honomi:'호노', ohani:'오하', kimdohyeon:'도현'};
  function shortName(id){ return SHORT[id] || (pdName[id]||id).slice(0,2); }

  var pds = [];           // [{id,name}]
  var pdName = {};
  var merged = [];        // merged class entries (all PDs)
  var active = {};        // pd id -> true (filter)
  var curYm = null, minYm = null, maxYm = null, selectedDate = null;
  var packs = [];
  var admin = {};
  Object.defineProperty(admin, 'on', {get:function(){ return !!(window.PDAdmin && PDAdmin.isOn()); }});
  var moving = null;

  function pad(n){return String(n).length<2?'0'+n:String(n)}
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function dowOf(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]).getDay(); }
  function fmtKDate(s){ var p=s.split('-').map(Number); return p[1]+'월 '+p[2]+'일'; }
  function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
  function shiftYm(ym,d){
    var y=parseInt(ym.slice(0,4),10), m=parseInt(ym.slice(5,7),10)+d;
    while(m>12){m-=12;y++;} while(m<1){m+=12;y--;}
    return y+'-'+pad(m);
  }
  function mins(t){ var p=t.split(':'); return parseInt(p[0],10)*60+parseInt(p[1],10); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function roleOf(title){ if(/검수/.test(title)) return 'rev'; if(/통역/.test(title)) return 'int'; return 'main'; }
  var ROLE_PRI = {main:3, int:2, rev:1};
  function cleanTitle(t){ return t.replace(/\s*\((마무리\/)?(통역|검수)\)\s*$/,''); }

  function tagHtml(cat){
    var c = CATS[cat] || {label:cat, hue:0};
    return '<span class="tagc" style="--h:'+c.hue+'">'+esc(c.label)+'</span>';
  }

  // ---------- merge ----------
  function mergeAll(perPd){
    var map = {};
    var order = [];
    perPd.forEach(function(pack){
      pack.events.forEach(function(e){
        var role = roleOf(e.title);
        var key = e.date+'|'+e.category+'|'+(e.time||'');
        var x = map[key];
        if(!x){
          x = map[key] = {key:key, date:e.date, time:e.time, category:e.category, title:e.title, titleRole:role, blocks:false, people:{}, offPeople:{}, srcs:[]};
          order.push(key);
        }
        x.srcs.push({e:e, pd:pack.id, role:role});
        if(role==='main' && x.titleRole!=='main'){ x.title = e.title; x.titleRole = 'main'; }
        x.blocks = x.blocks || e.blocks;
        var bucket = e.blocks ? x.people : x.offPeople;
        if(!bucket[pack.id] || ROLE_PRI[role] > ROLE_PRI[bucket[pack.id]]) bucket[pack.id] = role;
      });
    });
    return order.map(function(k){
      var x = map[k];
      if(x.titleRole!=='main') x.title = cleanTitle(x.title);
      if(!x.blocks) x.people = x.offPeople;
      return x;
    }).sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?-1:1;
      return (a.time||'99:99').localeCompare(b.time||'99:99');
    });
  }

  // ---------- conflicts ----------
  // level 'person': the same person is in two classes that start close together
  function computeConflicts(list){
    var byDate = {};
    list.forEach(function(x){
      if(!x.blocks || !x.time) return;
      (byDate[x.date] = byDate[x.date] || []).push(x);
    });
    var out = [];
    Object.keys(byDate).sort().forEach(function(d){
      var l = byDate[d];
      for(var a=0;a<l.length;a++) for(var b=a+1;b<l.length;b++){
        var A=l[a], B=l[b];
        if(Math.abs(mins(A.time)-mins(B.time))>=WINDOW_MIN) continue;
        if(A.category===B.category) continue; // 같은 수업의 1부/2부
        var shared = Object.keys(A.people).filter(function(p){ return B.people[p]; });
        if(shared.length) out.push({date:d, level:'person', who:shared, a:A, b:B});
      }
    });
    return out;
  }

  var conflicts = [];
  var conflictByDate = {};
  var interpConflicts = [];
  var conflictByDateInterp = {};
  function indexOne(list){
    var m = {};
    list.forEach(function(c){
      var cur = m[c.date];
      if(!cur || c.level==='person') m[c.date] = c.level;
    });
    return m;
  }
  function indexConflicts(){
    conflictByDate = indexOne(conflicts);
    interpConflicts = conflicts.filter(function(c){ return isInterpClass(c.a) && isInterpClass(c.b); });
    conflictByDateInterp = indexOne(interpConflicts);
  }
  function curConflicts(){ return interpMode ? interpConflicts : conflicts; }
  function curConflictByDate(){ return interpMode ? conflictByDateInterp : conflictByDate; }

  // ---------- filtering ----------
  function visibleEvents(){
    var list = merged;
    if(interpMode) list = list.filter(isInterpClass);
    var anyOn = PD_IDS.some(function(id){ return active[id]; });
    if(!anyOn) return list;
    return list.filter(function(x){
      return Object.keys(x.people).some(function(p){ return active[p]; });
    });
  }
  function byDateMap(list){
    var m = {};
    list.forEach(function(x){ (m[x.date] = m[x.date] || []).push(x); });
    return m;
  }

  function peopleHtml(x){
    if(x.category==='holiday') return '';
    var ids = Object.keys(x.people).sort(function(a,b){ return PD_IDS.indexOf(a)-PD_IDS.indexOf(b); });
    var main = ids.filter(function(p){ return x.people[p]==='main'; });
    var intr = ids.filter(function(p){ return x.people[p]==='int'; });
    var rev = ids.filter(function(p){ return x.people[p]==='rev'; });
    var html = main.map(function(p){ return PD_HUE[p]!==undefined ? '<span class="pdchip c" style="--h:'+PD_HUE[p]+'">'+esc(pdName[p]||p)+'</span>' : '<span class="pdchip">'+esc(pdName[p]||p)+'</span>'; }).join('');
    html += intr.map(function(p){ return '<span class="pdchip int">'+esc(pdName[p]||p)+' 통역</span>'; }).join('');
    html += rev.map(function(p){ return '<span class="pdchip rev">'+esc(pdName[p]||p)+' 검수</span>'; }).join('');
    return html ? '<div class="pdchips">'+html+'</div>' : '';
  }

  function conflictNoteFor(x){
    var notes = [];
    curConflicts().forEach(function(c){
      if(c.a!==x && c.b!==x) return;
      var other = c.a===x ? c.b : c.a;
      if(c.level==='person'){
        notes.push('<div class="cnote person">⚠ '+c.who.map(function(p){return esc(pdName[p]||p);}).join(', ')+' 님이 '+esc(other.time)+' '+esc(cleanTitle(other.title))+'와(과) 시간이 겹쳐요</div>');
      } else {
        notes.push('<div class="cnote interp">통역 수업이 같은 시간대: '+esc(other.time)+' '+esc(cleanTitle(other.title))+'</div>');
      }
    });
    return notes.join('');
  }

  function pillHtml(x){
    var c = CATS[x.category] || {hue:0};
    var lab = cleanTitle(x.title).replace(/^\[[^\]]*\]\s*/,'');
    return '<span class="apill'+(x.blocks?'':' off')+'" style="--h:'+c.hue+'" draggable="true" data-key="'+esc(x.key)+'" title="'+esc(x.title)+'">'+(x.time?esc(x.time)+' ':'')+esc(lab)+'</span>';
  }
  function rowHtml(x){
    var timeLabel = x.time ? x.time : '녹화';
    var adm = admin.on ? '<div class="adm-row"><button type="button" data-act="edit">수정</button><button type="button" data-act="move">날짜 이동</button><button type="button" data-act="del" class="danger">삭제</button></div>' : '';
    return '<div class="ev ev-all'+(x.blocks?'':' is-off')+(admin.on?' adm':'')+'" data-key="'+esc(x.key)+'"'+(admin.on?' draggable="true"':'')+'>'
      + '<div class="ev-line"><span class="time mono">'+timeLabel+'</span>'
      + '<span class="title">'+esc(x.title)+'</span>'+tagHtml(x.category)+'</div>'
      + peopleHtml(x) + conflictNoteFor(x) + missingInterpNote(x) + adm
      + '</div>';
  }

  // ---------- render ----------
  function renderFilters(){
    var anyOn = PD_IDS.some(function(id){ return active[id]; });
    var html = '<button type="button" class="fchip'+(anyOn?'':' on')+'" data-pd="*">전체</button>';
    html += pds.map(function(p){
      return '<button type="button" class="fchip'+(active[p.id]?' on':'')+'" data-pd="'+p.id+'">'+esc(p.name)+'</button>';
    }).join('');
    var box = document.getElementById('filters');
    box.innerHTML = html;
  }

  function renderViewMode(){
    document.querySelectorAll('.vtab').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-view')===(interpMode?'interp':'all'));
    });
    if(interpMode){
      document.getElementById('pageTitle').textContent = '한중일 통역 수업';
      document.getElementById('pageTag').textContent = 'INT';
      document.getElementById('listTitle').textContent = '통역 수업 전체 일정';
      document.getElementById('pageFooter').textContent = '한중일(통역) 수업만 모아봤어요. 트랙디자인·조던쇼를 잡아라·GP1 한국 멘토처럼 통역이 꼭 필요한 수업은 통역자가 아직 배정 안 됐어도 여기에 잡혀요. 같은 사람(강의자·통역자 누구든)이 비슷한 시간에 두 수업에 잡힌 경우만 겹침으로 표시해요.';
    } else {
      document.getElementById('pageTitle').textContent = '전체 스케쥴';
      document.getElementById('pageTag').textContent = 'ALL';
      document.getElementById('listTitle').textContent = '전체 일정';
      document.getElementById('pageFooter').textContent = '모든 PD의 일정을 한 화면에 합친 페이지예요. 같은 수업은 한 줄로 묶고, 참여하는 PD와 통역을 아래에 표시해요. 겹침 표시는 시작 시각이 3시간 안으로 가까운 수업끼리 비교한 참고용이에요. 시간이 노션에 없는 수업은 19:00 기준이에요. 같은 사람(강의자·통역자 누구든)이 비슷한 시간에 두 수업에 잡힌 경우만 표시해요.';
    }
  }

  function renderConflictSummary(){
    var area = document.getElementById('conflictArea');
    var today = todayStr();
    var upcoming = curConflicts().filter(function(c){ return c.date>=today; });
    if(!upcoming.length){
      area.innerHTML = '<div class="csum ok">앞으로 겹치는 일정이 없어요.</div>';
      return;
    }
    var nPerson = upcoming.filter(function(c){return c.level==='person';}).length;
    var nInterp = upcoming.length - nPerson;
    var items = upcoming.map(function(c){
      var d = fmtKDate(c.date)+' ('+DOW[dowOf(c.date)]+')';
      var txt = c.level==='person'
        ? '<b>⚠ '+c.who.map(function(p){return esc(pdName[p]||p);}).join(', ')+'</b> 동시 배정: '
        : '<b>통역 수업 동시간:</b> ';
      return '<li data-date="'+c.date+'"><span class="mono d">'+d+'</span> '+txt
        + esc(c.a.time)+' '+esc(cleanTitle(c.a.title))+' / '+esc(c.b.time)+' '+esc(cleanTitle(c.b.title))+'</li>';
    }).join('');
    area.innerHTML = '<details class="csum"><summary>겹침 참고 '+upcoming.length+'건'
      + (nPerson?' · <span class="red">같은 사람 '+nPerson+'</span>':'')
      + (nInterp?' · 통역 수업 동시간 '+nInterp:'')
      + '</summary><ul>'+items+'</ul></details>';
    area.querySelector('ul').addEventListener('click', function(ev){
      var li = ev.target.closest('li'); if(!li) return;
      var d = li.getAttribute('data-date');
      selectedDate = d; renderCalendar(d.slice(0,7));
      document.getElementById('calArea').scrollIntoView({behavior:'smooth', block:'start'});
    });
  }

  function dayDetailHtml(ds, dayMap){
    var evs = dayMap[ds] || [];
    var blocking = evs.filter(function(x){return x.blocks;});
    var cn = curConflictByDate()[ds];
    var pill = '<span class="pill '+(blocking.length?'busy':'free')+'">'+(blocking.length?('수업 '+blocking.length+'개'):'수업 없음')+'</span>';
    var warn = cn==='person' ? '<span class="pill warn">⚠ 같은 사람 겹침</span>' : (cn==='interp' ? '<span class="pill amber">통역 수업 동시간</span>' : '');
    return '<div class="dd-head">'+pill+warn+'<span class="dd-date mono">'+fmtKDate(ds)+' ('+DOW[dowOf(ds)]+')</span></div>'
      + (evs.length ? '<div class="dd-list">'+evs.map(rowHtml).join('')+'</div>' : '<div class="dd-empty">등록된 일정이 없어요.</div>')
      + (admin.on ? '<button type="button" class="adm-add" data-date="'+ds+'">+ 이 날짜에 일정 추가</button>' : '');
  }

  function renderCalendar(ym){
    curYm = ym;
    var y = parseInt(ym.slice(0,4),10), m = parseInt(ym.slice(5,7),10);
    var vis = visibleEvents();
    var dayMap = byDateMap(vis);
    var total = daysInMonth(y,m), firstDow = dowOf(ym+'-01'), today = todayStr();
    var cells = [];
    for(var i=0;i<firstDow;i++) cells.push('<div class="cal-cell pad"></div>');
    for(var d=1; d<=total; d++){
      var ds = ym+'-'+pad(d);
      var evs = dayMap[ds] || [];
      var blocking = evs.filter(function(x){return x.blocks;});
      var cls = 'cal-cell all '+(blocking.length?'has':'none');
      if(ds===today) cls += ' today';
      if(ds===selectedDate) cls += ' selected';
      var cn = curConflictByDate()[ds];
      var mark = cn==='person' ? '<span class="cmark person">!</span>' : (cn==='interp' ? '<span class="cmark interp">!</span>' : '');
      var src = blocking.length ? blocking : evs;
      var who = {};
      src.forEach(function(x){
        if(x.category==='holiday') return;
        Object.keys(x.people).forEach(function(p){
          if(who[p]!=='main') who[p] = x.people[p];
        });
      });
      function nameSpans(role){
        return PD_IDS.filter(function(p){ return who[p]===role; }).map(function(p){
          var colored = role==='main' && PD_HUE[p]!==undefined;
          return '<span class="pn'+(colored?' c':'')+(blocking.length?'':' off')+'"'+(colored?' style="--h:'+PD_HUE[p]+'"':'')+'>'
            + '<span class="nf">'+esc(pdName[p]||p)+'</span><span class="ns">'+esc(shortName(p))+'</span></span>';
        }).join('');
      }
      var mainHtml = nameSpans('main'), intHtml = nameSpans('int');
      var names = (mainHtml ? '<span class="pgrp">'+mainHtml+'</span>' : '')
        + (intHtml ? '<span class="pgrp int">'+intHtml+'</span>' : '');
      if(admin.on){ names = '<span class="apills">'+evs.map(pillHtml).join('')+'</span>'; }
      var cnt = blocking.length ? '<span class="ccount">'+blocking.length+'</span>' : '';
      cells.push('<div class="'+cls+'" data-date="'+ds+'">'+mark+'<span class="num">'+d+'</span>'
        +'<span class="pnames">'+names+'</span>'+cnt+'</div>');
    }
    var trailing = (7 - (cells.length % 7)) % 7;
    for(var t=0;t<trailing;t++) cells.push('<div class="cal-cell pad"></div>');

    var area = document.getElementById('calArea');
    area.innerHTML =
      '<div class="cal-nav"><button id="prevBtn" '+(ym<=minYm?'disabled':'')+'>‹</button>'
      + '<span class="label">'+y+'년 '+m+'월</span>'
      + '<button id="nextBtn" '+(ym>=maxYm?'disabled':'')+'>›</button></div>'
      + '<div class="legend"><span class="pdlegend"><span class="pn c" style="--h:270">미친감성</span><span class="pn c" style="--h:48">나성준</span><span class="pn c" style="--h:215">허준호</span><span class="pn c" style="--h:0">김선휘</span><span>위 = 강의·진행 / 아래 구분선 = 통역 / 큰 숫자 = 수업 수</span></span>'
      + '<span><span class="cmark person inline">!</span>같은 사람 겹침</span>'
      + '</div>'
      + (admin.on && moving ? '<div class="movebanner"><span>옮길 날짜를 눌러 주세요</span><button type="button" id="moveCancel">취소</button></div>' : '')
      + '<div class="cal-dow">'+DOW.map(function(w){return '<span>'+w+'</span>';}).join('')+'</div>'
      + '<div class="cal-grid" id="calGrid">'+cells.join('')+'</div>'
      + '<div class="day-detail" id="dayDetail"></div>';

    document.getElementById('prevBtn').addEventListener('click', function(){ if(ym>minYm) renderCalendar(shiftYm(ym,-1)); });
    document.getElementById('nextBtn').addEventListener('click', function(){ if(ym<maxYm) renderCalendar(shiftYm(ym,1)); });
    document.getElementById('calGrid').addEventListener('click', function(ev){
      var cell = ev.target.closest('.cal-cell');
      if(!cell || cell.classList.contains('pad')) return;
      if(admin.on && moving){ doMove(moving, cell.getAttribute('data-date')); return; }
      selectedDate = cell.getAttribute('data-date');
      renderCalendar(curYm);
    });
    var mc = document.getElementById('moveCancel');
    if(mc) mc.addEventListener('click', function(){ moving = null; renderCalendar(curYm); });
    document.getElementById('dayDetail').innerHTML = (selectedDate && selectedDate.slice(0,7)===ym)
      ? dayDetailHtml(selectedDate, dayMap)
      : '<div class="dd-empty">날짜를 눌러서 그날 모든 PD의 일정을 확인해요.</div>';
  }

  function renderSchedule(){
    var vis = visibleEvents();
    var months = {};
    vis.forEach(function(x){
      var mk = x.date.slice(0,7);
      months[mk] = months[mk] || {};
      (months[mk][x.date] = months[mk][x.date] || []).push(x);
    });
    var mks = Object.keys(months).sort(), today = todayStr();
    document.getElementById('monthNav').innerHTML = mks.map(function(mk){
      return '<a href="#m-'+mk+'">'+parseInt(mk.slice(5,7),10)+'월</a>';
    }).join('');
    document.getElementById('scheduleArea').innerHTML = mks.map(function(mk){
      var daysHtml = Object.keys(months[mk]).sort().map(function(dk){
        var isToday = dk===today, cn = curConflictByDate()[dk];
        var badge = cn==='person' ? '<span class="cmark person inline">!</span>' : (cn==='interp' ? '<span class="cmark interp inline">!</span>' : '');
        return '<div class="day"><div class="day-head"><span class="date-num">'+parseInt(dk.slice(5,7),10)+'/'+parseInt(dk.slice(8,10),10)+'</span>'
          + '<span class="dow">('+DOW[dowOf(dk)]+')</span>'+(isToday?'<span class="today-mark">오늘</span>':'')+badge+'</div>'
          + months[mk][dk].map(rowHtml).join('')+'</div>';
      }).join('');
      return '<div class="month" id="m-'+mk+'"><h3>'+mk.slice(0,4)+'년 '+parseInt(mk.slice(5,7),10)+'월</h3>'+daysHtml+'</div>';
    }).join('');
  }

  function renderAll(){
    renderViewMode();
    renderFilters();
    renderConflictSummary();
    var vis = visibleEvents();
    if(!vis.length){
      document.getElementById('calArea').innerHTML = '<div class="empty">표시할 일정이 없어요.</div>';
      document.getElementById('scheduleArea').innerHTML = '';
      return;
    }
    var todayYm = todayStr().slice(0,7);
    var keep = (curYm && curYm>=minYm && curYm<=maxYm) ? curYm : ((todayYm>=minYm && todayYm<=maxYm) ? todayYm : minYm);
    renderCalendar(keep);
    renderSchedule();
  }

  document.getElementById('filters').addEventListener('click', function(ev){
    var b = ev.target.closest('.fchip'); if(!b) return;
    var id = b.getAttribute('data-pd');
    if(id==='*') PD_IDS.forEach(function(p){ active[p]=false; });
    else active[id] = !active[id];
    renderAll();
  });
  document.getElementById('viewTabs').addEventListener('click', function(ev){
    var b = ev.target.closest('.vtab'); if(!b) return;
    var v = b.getAttribute('data-view');
    interpMode = (v==='interp');
    selectedDate = null; curYm = null;
    var url = new URL(location.href);
    if(interpMode) url.searchParams.set('view','interp'); else url.searchParams.delete('view');
    history.replaceState(null, '', url.pathname + (url.search ? url.search : ''));
    if(merged.length){
      var vis = visibleEvents();
      minYm = (vis.length?vis:merged)[0].date.slice(0,7);
      maxYm = (vis.length?vis:merged)[(vis.length?vis.length:merged.length)-1].date.slice(0,7);
    }
    renderAll();
  });

  function load(){
    if(admin.on) return Promise.resolve();
    return fetch(PDSync.bust('data/pds.json'), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(list){
      pds = list;
      pdName = {};
      list.forEach(function(p){ pdName[p.id] = p.name.replace(/\s*PD$/,''); });
      PD_IDS = list.map(function(p){ return p.id; });
      return Promise.all(list.map(function(p){
        return fetch(PDSync.bust('data/'+p.id+'.json'), {cache:'no-store'})
          .then(function(r){ return r.ok ? r.json() : []; })
          .catch(function(){ return []; })
          .then(function(ev){ return {id:p.id, events:ev}; });
      }));
    }).then(function(loaded){
      packs = loaded; tagPacks();
      var n = 0; packs.forEach(function(p){ n += p.events.length; });
      merged = mergeAll(packs);
      conflicts = computeConflicts(merged);
      indexConflicts();
      if(!merged.length){
        document.getElementById('syncNote').textContent = '등록된 일정이 없어요.';
        document.getElementById('calArea').innerHTML = '<div class="empty">아직 등록된 일정이 없어요.</div>';
        return;
      }
      var initVis = visibleEvents();
      var rangeSrc = initVis.length ? initVis : merged;
      minYm = rangeSrc[0].date.slice(0,7);
      maxYm = rangeSrc[rangeSrc.length-1].date.slice(0,7);
      document.getElementById('syncNote').textContent = 'PD '+packs.length+'명 · 수업 '+merged.length+'개 (PD별 등록 '+n+'건을 합침)';
      renderAll();
    }).catch(function(){
      document.getElementById('syncNote').textContent = '일정을 불러오지 못했어요.';
      document.getElementById('calArea').innerHTML = '<div class="empty">일정 파일을 불러오지 못했어요.</div>';
    });
  }
  // =====================================================================
  // 관리자 편집 (공용 admin.js 사용) — 전체 스케쥴: 여러 PD의 같은 수업을 한 줄로 합쳐 보여주므로
  // 수정/이동/삭제는 합쳐진 수업에 속한 모든 PD 항목(srcs)에 한꺼번에 적용해요.
  // =====================================================================
  function tagPacks(){
    packs.forEach(function(p){
      p.events.forEach(function(e){ Object.defineProperty(e, '_pd', {value:p.id, writable:true, enumerable:false, configurable:true}); });
    });
  }
  function rebuild(){
    merged = mergeAll(packs);
    conflicts = computeConflicts(merged);
    indexConflicts();
    if(merged.length){
      var rangeSrc2 = visibleEvents(); if(!rangeSrc2.length) rangeSrc2 = merged;
      minYm = rangeSrc2[0].date.slice(0,7); maxYm = rangeSrc2[rangeSrc2.length-1].date.slice(0,7);
    }
    if(selectedDate){ if(selectedDate.slice(0,7) < minYm) minYm = selectedDate.slice(0,7); if(selectedDate.slice(0,7) > maxYm) maxYm = selectedDate.slice(0,7); }
    renderAll(); PDAdmin.updateBar();
  }
  function findX(key){ for(var i=0;i<merged.length;i++) if(merged[i].key===key) return merged[i]; return null; }
  function dlabel(ds){ var p=ds.split('-').map(Number); return p[1]+'/'+p[2]+'('+DOW[dowOf(ds)]+')'; }
  function pdsOf(x){ var o = {}; x.srcs.forEach(function(s){ o[s.pd] = 1; }); return Object.keys(o); }

  function applyEdit(x, f){
    var titleChanged = f.title !== x.title;
    x.srcs.forEach(function(s){
      var e = s.e;
      e.date = f.date; e.time = f.time || null; e.category = f.category;
      if(f.blocks !== x.blocks && e.blocks === x.blocks) e.blocks = f.blocks;
      if(titleChanged && e.blocks === f.blocks){ e.title = s.role==='int' ? cleanTitle(f.title)+' (통역)' : f.title; }
    });
  }
  function doMove(key, newDate){
    var x = findX(key); moving = null;
    if(!x || x.date===newDate){ renderCalendar(curYm); return; }
    var old = x.date, pdl = pdsOf(x);
    applyEdit(x, {title:x.title, date:newDate, time:x.time, category:x.category, blocks:x.blocks});
    PDAdmin.log('이동: '+cleanTitle(x.title)+' '+dlabel(old)+' → '+dlabel(newDate), pdl);
    selectedDate = newDate; curYm = newDate.slice(0,7);
    rebuild();
  }
  function deleteX(x){
    x.srcs.forEach(function(s){
      var p = packs.filter(function(q){ return q.id===s.pd; })[0];
      var i = p.events.indexOf(s.e); if(i>=0) p.events.splice(i,1);
    });
  }
  function openEditX(x){
    PDAdmin.openEdit({title:cleanTitle(x.title), date:x.date, time:x.time, category:x.category, blocks:x.blocks}, function(f){
      var origDate = x.date, pdl = pdsOf(x);
      if(cleanTitle(x.title)===f.title) f.title = x.title;
      applyEdit(x, f);
      PDAdmin.log('수정: '+f.title+(origDate!==f.date?' ('+dlabel(origDate)+' → '+dlabel(f.date)+')':''), pdl);
      selectedDate = f.date; curYm = f.date.slice(0,7);
      rebuild();
    });
  }
  function openAddX(date){
    PDAdmin.openAdd({mode:'multi', date:date, category:'album'}, function(f, who){
      var ids = [];
      who.forEach(function(w){
        var p = packs.filter(function(q){ return q.id===w.pd; })[0];
        var e = {date:f.date, time:f.time, title:(w.role==='int' ? cleanTitle(f.title)+' (통역)' : f.title), category:f.category, blocks:f.blocks};
        Object.defineProperty(e, '_pd', {value:w.pd, writable:true, enumerable:false, configurable:true});
        p.events.push(e); ids.push(w.pd);
      });
      PDAdmin.log('추가: '+f.title+' '+dlabel(f.date), ids);
      selectedDate = f.date; curYm = f.date.slice(0,7);
      rebuild();
    });
  }

  PDAdmin.init({
    btn: document.getElementById('admBtn'),
    cats: CATS,
    getPds: function(){ return pds; },
    onEnter: function(){ return PDAdmin.loadPacks(PD_IDS).then(function(l){ packs = l; tagPacks(); moving = null; }); },
    onExit: function(){ moving = null; load(); },
    rerender: rebuild,
    getFiles: function(){ return packs.map(function(p){ return {key:p.id, path:'data/'+p.id+'.json', text:PDAdmin.serialize(p.events)}; }); }
  });

  function openPillMenu(x){
    var m = PDAdmin.openModal('<h3>'+PDAdmin.esc(cleanTitle(x.title))+'</h3>'
      + '<div class="pmenu-sub">'+dlabel(x.date)+(x.time?' '+x.time:'')+'</div>'
      + '<div class="btns"><button type="button" id="pEdit">수정</button><button type="button" id="pMove">날짜 이동</button><button type="button" id="pDel">삭제</button></div>'
      + '<div class="hint">PC에서는 달력 칸 안의 일정을 끌어서 다른 날짜에 놓아도 돼요.</div>');
    m.querySelector('#pEdit').addEventListener('click', function(){ PDAdmin.closeModal(); openEditX(x); });
    m.querySelector('#pMove').addEventListener('click', function(){ PDAdmin.closeModal(); moving = x.key; renderCalendar(curYm); });
    m.querySelector('#pDel').addEventListener('click', function(){
      PDAdmin.closeModal();
      if(confirm('"'+cleanTitle(x.title)+'" ('+dlabel(x.date)+') 일정을 삭제할까요?')){
        var pdl = pdsOf(x); deleteX(x); PDAdmin.log('삭제: '+cleanTitle(x.title)+' '+dlabel(x.date), pdl); rebuild();
      }
    });
  }
  document.addEventListener('click', function(ev){
    if(!admin.on) return;
    var pill = ev.target.closest('.apill');
    if(pill && !moving){ ev.stopPropagation(); var px = findX(pill.getAttribute('data-key')); if(px) openPillMenu(px); return; }
    var add = ev.target.closest('.adm-add');
    if(add){ openAddX(add.getAttribute('data-date')); return; }
    var btn = ev.target.closest('.adm-row button');
    if(!btn) return;
    var row = btn.closest('.ev'); var x = row && findX(row.getAttribute('data-key'));
    if(!x) return;
    var act = btn.getAttribute('data-act');
    if(act==='edit') openEditX(x);
    else if(act==='move'){ moving = x.key; renderCalendar(curYm); document.getElementById('calArea').scrollIntoView({behavior:'smooth', block:'start'}); }
    else if(act==='del'){
      if(confirm('"'+cleanTitle(x.title)+'" ('+dlabel(x.date)+') 일정을 삭제할까요?')){
        var pdl = pdsOf(x); deleteX(x); PDAdmin.log('삭제: '+cleanTitle(x.title)+' '+dlabel(x.date), pdl); rebuild();
      }
    }
  });
  document.addEventListener('dragstart', function(ev){
    if(!admin.on) return;
    var row = ev.target.closest && ev.target.closest('.ev[draggable="true"], .apill[draggable="true"]'); if(!row) return;
    ev.dataTransfer.setData('text/plain', row.getAttribute('data-key')); ev.dataTransfer.effectAllowed = 'move';
  });
  document.addEventListener('dragover', function(ev){
    if(!admin.on) return;
    var cell = ev.target.closest && ev.target.closest('.cal-cell:not(.pad)');
    if(cell){ ev.preventDefault(); cell.classList.add('droptarget'); }
  });
  document.addEventListener('dragleave', function(ev){
    var cell = ev.target.closest && ev.target.closest('.cal-cell'); if(cell) cell.classList.remove('droptarget');
  });
  document.addEventListener('drop', function(ev){
    if(!admin.on) return;
    var cell = ev.target.closest && ev.target.closest('.cal-cell:not(.pad)');
    if(!cell) return;
    ev.preventDefault(); cell.classList.remove('droptarget');
    var key = ev.dataTransfer.getData('text/plain');
    if(key) doMove(key, cell.getAttribute('data-date'));
  });

  PDSync.ready.then(load);
  PDSync.onUpdate(load);
})();
</script>

</body>
</html>
