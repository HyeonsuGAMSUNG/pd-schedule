<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PD 스케쥴 관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>PD 스케쥴 관리</h1>
      <span class="tag-rec">REC</span>
    </div>
    <div class="sub">PD를 선택하면 해당 스케쥴표로 이동해요.</div>
  </div>
</header>

<div class="wrap">
  <a class="pd-card all-card" href="all.html">
    <span><span class="name">전체 스케쥴</span><div class="desc">모든 PD 일정을 한 화면에서 · 겹침 표시</div></span>
    <span class="arrow">›</span></a>
  <div id="pdList"></div>
  <footer>
    이 사이트는 정적 파일로만 동작해서 특정 계정이나 서비스 구독 상태와 무관하게 유지돼요.
    일정이 바뀌면 data 폴더 안의 json 파일을 새로 받아서 올려주면 반영돼요.
  </footer>
</div>

<script src="sync-status.js"></script>
<script>
function loadPds(){
  return fetch(PDSync.bust('data/pds.json'), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(pds){
    var list = document.getElementById('pdList');
    if(!pds.length){
      list.innerHTML = '<div class="empty">등록된 PD가 아직 없어요.</div>';
      return;
    }
    list.innerHTML = pds.map(function(pd){
      return '<a class="pd-card" href="schedule.html?pd='+encodeURIComponent(pd.id)+'">'
        + '<span><span class="name">'+pd.name+'</span><div class="desc">'+(pd.desc||'')+'</div></span>'
        + '<span class="arrow">›</span></a>';
    }).join('');
  }).catch(function(){
    document.getElementById('pdList').innerHTML = '<div class="empty">PD 목록을 불러오지 못했어요.</div>';
  });
}
PDSync.ready.then(loadPds);
PDSync.onUpdate(loadPds);
</script>

</body>
</html>
